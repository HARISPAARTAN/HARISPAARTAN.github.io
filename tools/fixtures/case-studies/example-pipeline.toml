# Invented fixture for tools/test_build_case_studies.py and for previewing the page generator.
# It describes a made-up weather-reading pipeline. No real company, person, product or system is meant.
# Format reference: content/case-studies/SCHEMA.md

[meta]
slug = "example-pipeline"
order = 1
status = "prototype"
tech = ["scripting", "relational store", "static pages"]
demo_url = "https://example.org/demo/"
facts_as_of = 2026-10-26

[hero]
eyebrow.en = "data pipeline"
eyebrow.de = "Datenpipeline"
title.en = "Example pipeline"
title.de = "Beispiel-Pipeline"
subtitle.en = "Hourly readings from field sensors, checked, stored and summarised"
subtitle.de = "Stündliche Messwerte von Feldsensoren, geprüft, gespeichert und zusammengefasst"
lead.en = """
Field sensors write one file per hour. A small script checks every reading against its allowed range, stores it in a
relational table and builds a daily summary for the analyst. **This pipeline is invented**: it exists to test the page
generator, not to describe a real system. See the [format reference](https://example.org/format) for the details.
"""
lead.de = """
Feldsensoren schreiben stündlich eine Datei. Ein kleines Skript prüft jeden Messwert gegen seinen zulässigen Bereich,
speichert ihn in einer relationalen Tabelle und erstellt für den Analysten eine Tagesübersicht. **Diese Pipeline ist
erfunden**: Sie dient dem Test des Seitengenerators und beschreibt kein echtes System. Details stehen in der
[Formatbeschreibung](https://example.org/format).
"""

[[hero.stats]]
value.en = "99.5 %"
value.de = "99,5 %"
label.en = "of readings pass the range check"
label.de = "der Messwerte bestehen die Bereichsprüfung"

[[hero.stats]]
value = "24"
label.en = "readings per station and day"
label.de = "Messwerte pro Station und Tag"

[[hero.stats]]
