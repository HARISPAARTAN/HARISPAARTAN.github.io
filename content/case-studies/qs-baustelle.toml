[[model.notes]]
title.en = "Categories and templates are data"
title.de = "Kategorien und Vorlagen sind Daten"
text.en = """
A new category or report layout is a change in SharePoint, not a new app version. The report flow refers to categories by
name, so adding one still needed a flow change once.
"""
text.de = """
Eine neue Kategorie oder ein neues Berichtslayout ist eine Änderung in SharePoint, keine neue App-Version. Der
Bericht-Flow verweist auf Kategorien über ihren Namen, deshalb brauchte das Hinzufügen einer Kategorie einmal doch eine
Änderung am Flow.
"""

[[model.notes]]
title.en = "Lists can grow"
title.de = "Listen dürfen wachsen"
text.en = """
The flows filter on indexed columns, created while the lists were still empty, so the lists can grow past SharePoint's
5,000-item view threshold. The app itself reads at most 2,000 rows of a list.
"""
text.de = """
Die Flows filtern auf indizierten Spalten, die angelegt wurden, als die Listen noch leer waren; so dürfen die Listen über
den Schwellenwert von 5.000 Elementen für SharePoint-Ansichten hinauswachsen. Die App selbst liest höchstens 2.000 Zeilen
einer Liste.
"""

[[model.notes]]
title.en = "Numbers per project"
title.de = "Nummern je Projekt"
text.en = """
Inspection and review numbers are plain numbers per project; the prefixes (QS-, T-) are added only for display, so the
next number is the highest plus one.
"""
text.de = """
Nummern von Begehungen und Abgleichen sind einfache Zahlen je Projekt; die Präfixe (QS-, T-) kommen nur für die Anzeige
dazu, sodass die nächste Nummer die höchste plus eins ist.
"""

[decisions]
heading.en = "Four trade-offs that shaped the build"
heading.de = "Vier Abwägungen, die den Aufbau bestimmt haben"

[[decisions.items]]
title.en = "Offline capture as a queue on the phone"
title.de = "Offline-Erfassung als Warteschlange auf dem Smartphone"
text.en = """
Sites often have no signal, and the built-in offline mode needs Dataverse, which would have made the app premium for every user. So captured
records wait in a queue on the phone and are written to SharePoint every 30 seconds when online; a record counts as
synced only after the write has succeeded. **Trade-off:** it works only in the Power Apps mobile player, not in a
browser, the phone's storage is limited, and videos and full-size photos still need a connection.
"""
text.de = """
Auf Baustellen fehlt oft der Empfang, und der eingebaute Offline-Modus braucht Dataverse, womit die App für alle Nutzenden Premium-Lizenzen gebraucht hätte. Deshalb warten erfasste Datensätze in einer Warteschlange auf dem Gerät und werden alle 30 Sekunden nach SharePoint
geschrieben, sobald es online ist; ein Datensatz gilt erst als synchronisiert, wenn das Schreiben gelungen ist.
**Abwägung:** Es funktioniert nur im Power-Apps-Player für Mobilgeräte, nicht im Browser, der Gerätespeicher ist
begrenzt, und Videos und Originalfotos brauchen weiterhin eine Verbindung.
"""

[[decisions.items]]
title.en = "Photos and videos go through flows, not list attachments"
title.de = "Fotos und Videos laufen über Flows, nicht über Listenanhänge"
text.en = """
A canvas app cannot write attachments from offline data, and a phone video of 50 to 150 MB cannot travel through a flow
as text. Photos wait in the queue and a flow files them; full-size photos and videos are attached to an upload row, and a
second flow files them on the server. **Trade-off:** more moving parts (four flows touch media), a connection is needed
for full-size photos and videos, and the SharePoint copy of a full-size photo appears after about a minute.
"""
text.de = """
Eine Canvas-App kann aus Offline-Daten keine Anhänge schreiben, und ein Handyvideo von 50 bis 150 MB lässt sich nicht
als Text durch einen Flow schicken. Fotos warten in der Warteschlange, und ein Flow legt sie ab; Originalfotos und Videos
hängen an einer Upload-Zeile, und ein zweiter Flow legt sie auf dem Server ab. **Abwägung:** mehr bewegliche Teile (vier
Flows berühren Medien), für Originalfotos und Videos ist eine Verbindung nötig, und die SharePoint-Kopie eines
Originalfotos erscheint nach etwa einer Minute.
"""

[[decisions.items]]
title.en = "Numbers are assigned on the server, one at a time"
title.de = "Nummern vergibt der Server, eine nach der anderen"
text.en = """
The phone gives each observation a local ID, and a flow that handles one record at a time writes the final number,
because two phones syncing together produced duplicate numbers when the app numbered observations itself. Inspections and
reviews are numbered when they are created online. **Trade-off:** the final number exists only after sync (photo files
carry 000 until the flow renames them), a deleted observation leaves a permanent gap that is accepted for traceability,
and numbering happens on creation only.
"""
text.de = """
Das Gerät gibt jeder Beobachtung eine lokale ID, und ein Flow, der jeweils nur einen Datensatz bearbeitet, schreibt die
endgültige Nummer. Als die App die Beobachtungen selbst nummerierte, entstanden doppelte Nummern, wenn zwei Geräte
gleichzeitig synchronisierten. Begehungen und Terminabgleiche werden beim Anlegen online nummeriert. **Abwägung:** Die
endgültige Nummer gibt es erst nach der Synchronisierung (Fotodateien tragen bis dahin 000), eine gelöschte Beobachtung
hinterlässt eine dauerhafte Lücke, die der Nachvollziehbarkeit wegen in Kauf genommen wird, und nummeriert wird nur beim
Anlegen.
"""

[[decisions.items]]
title.en = "A living schedule list plus write-once snapshots"
title.de = "Eine lebende Terminplan-Liste und einmal geschriebene Momentaufnahmen"
text.en = """
Every Excel import updates one master list of activities per project, and creating a schedule review copies the
lowest-level activities into rows that later imports never touch, so every past report regenerates unchanged.
**Trade-off:** about 90 to 130 rows are copied per review, three flows (upload, import, snapshot) replace one, and the app
reads only the first 2,000 rows of the snapshot list, a known limit that is still open.
"""
text.de = """
Jeder Excel-Import aktualisiert eine Stammliste der Vorgänge je Projekt, und beim Anlegen eines Terminabgleichs werden
die Vorgänge der untersten Ebene in Zeilen kopiert, die spätere Importe nie anfassen. So lässt sich jeder frühere
Bericht unverändert neu erzeugen. **Abwägung:** Pro Abgleich werden etwa 90 bis 130 Zeilen kopiert, drei Flows (Upload,
Import, Momentaufnahme) ersetzen einen, und die App liest nur die ersten 2.000 Zeilen der Momentaufnahme-Liste, eine
bekannte Grenze, die noch offen ist.
"""

[role]
[[role.bullets]]
en = """
**Gathered the requirements** with the supervisor and ran the feedback rounds from 24 August 2026, each answered by a
written plan and a build.
"""
de = """
**Anforderungen erhoben**, gemeinsam mit der Führungskraft, und ab dem 24. August 2026 die Feedbackrunden geführt; jede Runde wurde mit einem schriftlichen Plan und einem Build beantwortet.
"""

[[role.bullets]]
en = """
**Planned the project**, put the open questions to the supervisor and decided the technical design (the trade-offs above).
"""
de = """
**Das Projekt geplant**, offene Fragen der Führungskraft vorgelegt und das technische Design entschieden (die
Abwägungen oben).
"""

[[role.bullets]]
en = """
**Designed the data model** on top of the supervisor's concept (two modules, folder tree, naming scheme), then built and migrated it in SharePoint.
"""
de = """
**Das Datenmodell entworfen**, aufbauend auf dem Konzept der Führungskraft (zwei Module, Ordnerbaum, Namensschema), und es anschließend in SharePoint aufgebaut und migriert.
"""

[[role.bullets]]
en = """
**Built the app, the flows and the backend** and released the revisions as versioned builds (numbered app revisions built
with the Power Platform CLI, numbered flow packages), each app build error-checked.
"""
de = """
**Die App, die Flows und das Backend gebaut** und die Revisionen als versionierte Builds veröffentlicht (nummerierte
App-Revisionen, gebaut mit der Power Platform CLI, nummerierte Flow-Pakete), jeden App-Build auf Fehler geprüft.
"""

[[role.bullets]]
en = """
**Tested and fixed** faults found in flow runs and field tests, for example an import that reported success while loading
no rows, and reports that lost their photos from the second review on.
"""
de = """
**Fehler aus Flow-Läufen und Feldtests untersucht und behoben**, zum Beispiel einen Import, der Erfolg meldete, ohne
Zeilen zu laden, und Berichte, die ab dem zweiten Abgleich ihre Fotos verloren.
"""

[[role.bullets]]
en = """
**Wrote and delivered the user guides** in German and English (version 1.1 of 18 August 2026, for the first build) and a
bilingual handbook (2 September 2026).
"""
de = """
**Die Anleitungen geschrieben und übergeben**, auf Deutsch und Englisch (Version 1.1 vom 18. August 2026, für den ersten
Build), dazu ein zweisprachiges Handbuch (2. September 2026).
"""

[result]
heading.en = "In use since September 2026, at revision 45"
heading.de = "Seit September 2026 im Einsatz, Revision 45"
text.en = """
**Published on 1 September 2026.** The plan is dated 4 August 2026, and the first recorded inspection with photos is
dated 9 September 2026. The revision counter reached 45 about eleven weeks after the plan, with the last build dated
21 October 2026. In the Word report, photos appear as thumbnails and videos as links. A
self-check stops the run if a template field is left unfilled, the report is marked as sent only at the very end, and a
failed run mails an error instead. The demo shows the app's screens with a fictional company and invented data.
"""
text.de = """
**Am 1. September 2026 veröffentlicht.** Der Plan datiert vom 4. August 2026, und die erste dokumentierte Begehung mit
Fotos ist auf den 9. September 2026 datiert. Der Revisionszähler erreichte etwa elf Wochen nach dem Plan die 45, der
letzte Build ist vom 21. Oktober 2026. Im Word-Bericht erscheinen Fotos als Vorschaubilder und Videos als Links. Eine Selbstprüfung stoppt den Lauf, wenn ein Feld
der Vorlage unausgefüllt bleibt, der Bericht wird erst ganz am Ende als versendet markiert, und ein fehlgeschlagener Lauf
verschickt stattdessen eine Fehlermeldung. Die Demo zeigt die Bildschirme der App mit einem fiktiven Unternehmen und
erfundenen Daten.
"""
