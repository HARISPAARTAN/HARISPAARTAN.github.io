[[flow.steps]]
id = "start"
title.en = "Start online"
title.de = "Online starten"
text.en = """
The inspector opens a project and creates the inspection (Begehung) while online. The app gives it the next number in
that project.
"""
text.de = """
Die prüfende Person öffnet ein Projekt und legt die Begehung online an. Die App vergibt die nächste Nummer in diesem
Projekt.
"""
nodes = ["app", "lists"]
edges = ["start"]

[[flow.steps]]
id = "plan"
title.en = "Load the plan"
title.de = "Plan laden"
text.en = """
For a schedule review the Excel schedule is uploaded from the app. A flow files it and reads it with an **Office
Script**, and every lowest-level activity becomes a row of the review. For an inspection, an Excel checklist becomes
prepared observations the same way.
"""
text.de = """
Für einen Terminabgleich wird der Excel-Terminplan aus der App hochgeladen. Ein Flow legt ihn ab und liest ihn mit einem
**Office Script**, und jeder Vorgang der untersten Ebene wird zu einer Zeile des Abgleichs. Für eine Begehung werden aus
einer Excel-Checkliste auf demselben Weg vorbereitete Beobachtungen.
"""
nodes = ["app", "import", "lists"]
edges = ["upload", "rows"]
badge = { node = "import", text = "EXCEL" }

[[flow.steps]]
id = "capture"
title.en = "Capture on site, offline"
title.de = "Vor Ort erfassen, offline"
text.en = """
Observations with category and text, photos and schedule progress are saved on the phone and queued, with or without
signal.
"""
text.de = """
Beobachtungen mit Kategorie und Text, Fotos und Terminfortschritt werden auf dem Smartphone gespeichert und eingereiht,
mit oder ohne Netz.
"""
nodes = ["app", "store"]
edges = ["capture"]
badge = { node = "store", text = "OFFLINE" }

[[flow.steps]]
id = "sync"
title.en = "Sync every 30 seconds"
title.de = "Alle 30 Sekunden synchronisieren"
text.en = """
When online, the queue writes the records to the lists and sends each photo through a flow into the library. Videos and
full-size photos are attached to an upload row and filed by a flow; they need a connection.
"""
text.de = """
Sobald das Gerät online ist, schreibt die Warteschlange die Datensätze in die Listen und schickt jedes Foto über einen
Flow in die Projektablage. Videos und Originalfotos hängen an einer Upload-Zeile und werden von einem Flow abgelegt;
sie brauchen eine Verbindung.
"""
nodes = ["store", "lists", "filing", "library"]
edges = ["sync", "photos", "file"]
badge = { node = "store", text.en = "EVERY 30 S", text.de = "ALLE 30 S" }

[[flow.steps]]
id = "number"
title.en = "Number and file"
title.de = "Nummerieren und ablegen"
text.en = """
A new observation starts a flow that runs **one at a time**. It gives the observation its final number and renames and
moves its photos and videos into the inspection folder by naming convention.
"""
text.de = """
Eine neue Beobachtung startet einen Flow, der **immer nur einen Datensatz** bearbeitet. Er vergibt die endgültige
Nummer und benennt die Fotos und Videos nach der Namenskonvention um und verschiebt sie in den Ordner der Begehung.
"""
nodes = ["lists", "filing", "library"]
edges = ["number", "numberback", "file"]

[[flow.steps]]
id = "report"
title.en = "One tap, one report"
title.de = "Ein Fingertipp, ein Bericht"
text.en = """
The report flow reads the records and photos, fills the HTML template, saves the Word file in the inspection folder and
e-mails it to the chosen recipient with links to the file and the media folder. The button stays disabled until all
media are synced.
"""
text.de = """
Der Bericht-Flow liest Datensätze und Fotos, füllt die HTML-Vorlage, speichert die Word-Datei im Ordner der Begehung und
versendet sie an die gewählte Adresse, mit Links zur Datei und zum Medienordner. Der Knopf bleibt gesperrt, bis alle
Medien synchronisiert sind.
"""
nodes = ["app", "report", "lists", "library"]
edges = ["tap", "read", "readphotos", "save"]
badge = { node = "report", text.en = "ONE TAP", text.de = "EIN TIPP" }

[model]
heading.en = "Six lists and a project library"
heading.de = "Sechs Listen und die Projektablage"
description.en = """
A project has many inspections, many schedule reviews and many categories. An inspection has many observations, and each
observation has one category. A schedule review has many schedule items. Files in the project library point to their
observation, schedule item, inspection or review through plain columns.
"""
description.de = """
Ein Projekt hat viele Begehungen, viele Terminabgleiche und viele Kategorien. Eine Begehung hat viele Beobachtungen, und
jede Beobachtung hat eine Kategorie. Ein Terminabgleich hat viele Terminplaneinträge. Dateien in der Projektablage
verweisen über einfache Spalten auf ihre Beobachtung, ihren Terminplaneintrag, ihre Begehung oder ihren Terminabgleich.
"""
caption.en = """
Simplified: 7 of 10 SharePoint objects (6 of the 9 lists plus the library). Left out: the activity master list that the
import flow keeps, the upload-request list (a work queue for attachments) and the list behind the route export. Rows are
keyed by their SharePoint item ID unless a business key is named. Files in the library point to the record they belong to
through plain columns, not lookups.
"""
caption.de = """
Vereinfacht: 7 von 10 SharePoint-Objekten (6 der 9 Listen plus die Bibliothek). Weggelassen: die Stammliste der Vorgänge,
die der Import-Flow pflegt, die Liste der Upload-Anfragen (eine Arbeitswarteschlange für Anhänge) und die Liste hinter dem
Routen-Export. Zeilen werden über ihre SharePoint-Element-ID identifiziert, sofern kein Geschäftsschlüssel genannt ist.
Dateien in der Bibliothek verweisen über einfache Spalten auf den zugehörigen Datensatz, nicht über Nachschlagefelder.
"""

