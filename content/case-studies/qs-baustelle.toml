[why]
heading.en = "Paper sheets, photos on private phones, reports built by hand"
heading.de = "Papierbögen, Fotos auf privaten Handys und Berichte in Handarbeit"

[[why.paragraphs]]
en = """
Inspection sheets were printed, filled in and typed in again, so every site inspection (Begehung) was recorded twice.
Photos sat on private phones, in e-mails and in chat threads, apart from the finding they belonged to. Reports were
assembled by hand: photos exported to a PC and inserted into a Word document one by one.
"""
de = """
Prüfbögen wurden ausgedruckt, ausgefüllt und anschließend abgetippt, sodass jede Begehung doppelt erfasst wurde. Fotos
lagen auf privaten Handys, in E-Mails und in Chatverläufen, getrennt von der Beobachtung, zu der sie gehörten. Berichte
entstanden von Hand: Die Fotos wurden auf einen PC exportiert und einzeln in ein Word-Dokument eingefügt.
"""

[[why.paragraphs]]
en = """
There was no central, traceable record. Sheets get lost, and construction clients in Germany expect auditable
documentation. Sites often have no signal, in basements and tunnels, so capture had to work offline and sync later.
The comparison of planned and actual progress per activity of the Terminplan (schedule), called Terminabgleich
(schedule review), had no structured place either.
"""
de = """
Es gab keine zentrale, nachvollziehbare Ablage. Bögen gehen verloren, und Auftraggebende im Bauwesen erwarten in
Deutschland eine prüffähige Dokumentation. Auf Baustellen gibt es oft keinen Empfang, etwa in Kellern und Tunneln;
die Erfassung musste also offline funktionieren und später synchronisieren. Auch der Vergleich von geplantem und
tatsächlichem Fortschritt je Vorgang des Terminplans, der Terminabgleich, hatte keinen strukturierten Platz.
"""

[[why.paragraphs]]
en = """
**The specification asked for the app to replace the paper sheets.** In QS Baustelle an observation, its category, its
photos and the schedule progress stay together as records in SharePoint, and the report is built from those records.
"""
de = """
**Die Vorgabe lautete, die Papierbögen zu ersetzen.** In QS Baustelle bleiben eine Beobachtung, ihre Kategorie, ihre
Fotos und der Terminfortschritt als Datensätze in SharePoint beisammen, und der Bericht entsteht aus diesen Datensätzen.
"""

[[why.notes]]
title.en = "Who uses it"
title.de = "Wer sie nutzt"
text.en = """
Built for site inspectors, who walk a site and often have no signal. Project managers and external clients receive the
reports. The supervisor ran the test rounds and the recorded inspections.
"""
text.de = """
Gebaut für Prüfende, die über die Baustelle gehen und oft keinen Empfang haben. Projektleitungen und externe
Auftraggebende erhalten die Berichte. Die Führungskraft hat die Testrunden und die dokumentierten Begehungen
durchgeführt.
"""

[[why.notes]]
title.en = "What it costs to run"
title.de = "Was der Betrieb kostet"
text.en = "No servers of its own: the app, the lists and the flows all run inside the company's Microsoft 365."
text.de = "Keine eigenen Server: App, Listen und Flows laufen im Microsoft 365 des Unternehmens."

[flow]
heading.en = "How an inspection travels from the phone to the Word report"
heading.de = "Wie eine Begehung vom Smartphone zum Word-Bericht kommt"
description.en = """
A canvas app on the phone starts inspections and schedule reviews and keeps captured data in a phone store, which writes
to SharePoint lists and, through filing flows (numbering, filing media, route export), to the project library. Import
flows turn Excel files into rows; report flows build the Word report from lists and library and e-mail it.
"""
description.de = """
Eine Canvas-App auf dem Smartphone startet Begehungen und Terminabgleiche und legt erfasste Daten in einem Gerätespeicher
ab, der in SharePoint-Listen und über Ablage-Flows (Nummerieren, Medien ablegen, Routen-Export) in die Projektablage
schreibt. Import-Flows machen aus Excel-Dateien Zeilen; Bericht-Flows erstellen aus Listen und Projektablage den
Word-Bericht und versenden ihn per E-Mail.
"""

