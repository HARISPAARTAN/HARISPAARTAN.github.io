[hero]
eyebrow.en = "power apps"
eyebrow.de = "power apps"
title.en = "QS Baustelle"
title.de = "QS Baustelle"
subtitle.en = "Site inspections that keep working offline, with a Word report on one tap"
subtitle.de = "Baustellenbegehungen, die auch offline funktionieren, mit Word-Bericht per Fingertipp"
lead.en = """
QS Baustelle is a Power Apps canvas app for site inspections on construction sites. It lets inspectors record
observations, photos and schedule progress on the phone, with or without signal; when the phone is online the data
syncs to SharePoint, and one tap sends a Word report by e-mail. I developed it as a working student at S01
Projektmanagement GmbH, from the first plan to revision 45, based on the supervisor's concept.
"""
lead.de = """
QS Baustelle ist eine Canvas-App in Power Apps für Begehungen auf Baustellen. Mit ihr erfassen Prüfende Beobachtungen,
Fotos und Terminfortschritt auf dem Smartphone, mit oder ohne Netz; sobald das Gerät online ist, werden die Daten nach
SharePoint synchronisiert, und ein Fingertipp verschickt den Word-Bericht per E-Mail. Ich habe sie als Werkstudent bei
der S01 Projektmanagement GmbH entwickelt, vom ersten Plan bis zur Revision 45, nach dem Konzept der Führungskraft.
"""

