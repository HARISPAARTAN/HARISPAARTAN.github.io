[flow]
heading.en = "How content becomes a checked, live gallery"
heading.de = "Wie aus Inhalt eine geprüfte, veröffentlichte Galerie wird"
description.en = """
The bilingual content, the demo recipes with their themes and the component kit feed the static generator. Its
output goes through the quality gates and the CI and deploy workflow to the live gallery, where the motion runtime
upgrades the pages in the browser.
"""
description.de = """
Die zweisprachigen Texte, die Demo-Rezepte mit ihren Themes und der Komponenten-Baukasten speisen den statischen
Generator. Seine Ausgabe durchläuft die Qualitätsprüfung und den CI- und Deployment-Ablauf bis zur Live-Galerie, wo
die Animation im Browser die Seiten aufwertet.
"""

[[flow.nodes]]
