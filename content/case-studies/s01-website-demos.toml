[decisions]

[[decisions.items]]
title.en = "One content source, the same structure everywhere"
title.de = "Eine Inhaltsquelle, überall dieselbe Struktur"
text.en = """
All text lives in two language files with identical keys, and the page set and section order are fixed in code.
Reviewers compare design, not copy, and the two files cannot drift apart. **Trade-off:** every demo has the same
pages in the same order.
"""
text.de = """
Der gesamte Text liegt in zwei Sprachdateien mit identischen Schlüsseln; Seitenumfang und Reihenfolge der Abschnitte
sind im Code festgelegt. Wer prüft, vergleicht Design statt Text, und die beiden Dateien können nicht
auseinanderlaufen. **Abwägung:** Jede Demo hat dieselben Seiten in derselben Reihenfolge.
"""

[[decisions.items]]
title.en = "Recipes, a kit and theme tokens"
title.de = "Rezepte, Baukasten und Theme-Variablen"
text.en = """
A demo is a small recipe plus a theme file; the kit holds eight swappable components as plain functions that return
HTML. New directions and global changes become small edits. **Trade-off:** the demos share one markup skeleton, so
they differ only as far as the variants and styles allow.
"""
text.de = """
Eine Demo besteht aus einem kleinen Rezept und einer Theme-Datei; der Baukasten enthält acht austauschbare
Komponenten als einfache Funktionen, die HTML liefern. Neue Richtungen und globale Änderungen werden zu kleinen
Anpassungen. **Abwägung:** Alle Demos teilen sich ein Markup-Gerüst und unterscheiden sich nur so weit, wie Varianten
und Stile es erlauben.
"""

[[decisions.items]]
title.en = "Pre-rendered pages behind a gate"
title.de = "Vorab erzeugte Seiten hinter einer Prüfschranke"
text.en = """
Node writes plain HTML for every demo, language and page, with relative links, so the site works under a GitHub
Pages sub-path and locally. GitHub Actions runs the tests, the build and the checker before it publishes.
**Trade-off:** no CMS and no backend, so the demo forms send nothing, and the Playwright layout checks run only
locally.
"""
text.de = """
Node schreibt schlichtes HTML für jede Demo, Sprache und Seite, mit relativen Links, sodass die Seite unter einem
GitHub-Pages-Unterpfad und lokal funktioniert. GitHub Actions führt Tests, Build und Prüfprogramm aus, bevor es
veröffentlicht. **Abwägung:** Es gibt kein CMS und kein Backend, die Demo-Formulare senden also nichts, und die
Playwright-Layoutprüfungen laufen nur lokal.
"""

[[decisions.items]]
title.en = "Motion as an enhancement"
title.de = "Bewegung als Zusatz"
text.en = """
Reveals, parallax and page transitions are switched on only for visitors who have not asked for reduced motion, and
one demo opts in to a cinematic level. Content is never hidden from visitors without scripts, with reduced motion or
when printing. **Trade-off:** more runtime code to maintain, and page transitions only in newer Chrome and Safari.
"""
text.de = """
Einblendungen, Parallaxe und Seitenübergänge laufen nur, wenn keine reduzierte Bewegung eingestellt ist; eine Demo wählt zusätzlich eine filmische Stufe. Ohne Skripte, mit reduzierter Bewegung und beim Drucken bleiben alle Inhalte sichtbar. **Abwägung:** mehr Laufzeitcode zu pflegen, und Seitenübergänge gibt es nur
in neueren Versionen von Chrome und Safari.
"""

