tall = ["pages.bottom", "motion.top"]

[[flow.steps]]
id = "write"
title.en = "Write the content once"
title.de = "Inhalt einmal schreiben"
text.en = """
Two language files hold all text under the same keys, and **the build stops** if a key exists in only one language.

"""
text.de = """
Zwei Sprachdateien enthalten allen Text unter denselben Schlüsseln, und **der Build bricht ab**, wenn ein Schlüssel
nur in einer Sprache existiert. 
"""
nodes = ["content", "generator"]
edges = ["read-content"]

[[flow.steps]]
id = "recipe"
title.en = "Describe each demo as a recipe"
title.de = "Jede Demo als Rezept beschreiben"
text.en = """
A recipe names the layout variants, fonts, video and motion level of one demo; a theme file sets its colours.
**Unknown names are rejected** and the build lists the valid ones.
"""
text.de = """
Ein Rezept legt Layoutvarianten, Schriften, Video und Bewegungsstufe einer Demo fest, eine Theme-Datei die Farben.
**Unbekannte Namen werden abgelehnt**, und der Build nennt die gültigen.
"""
nodes = ["recipes", "generator"]
edges = ["read-recipes"]

[[flow.steps]]
id = "render"
title.en = "Render every page"
title.de = "Jede Seite erzeugen"
text.en = """
The generator takes the chosen variants from the kit and writes **96 pages** plus the gallery.
"""
text.de = """
Der Generator holt die gewählten Varianten aus dem Baukasten und schreibt **96 Seiten** plus die Galerie.
"""
nodes = ["kit", "generator"]
edges = ["read-kit"]
badge = { node = "generator", text.en = "96 PAGES", text.de = "96 SEITEN" }

[[flow.steps]]
id = "check"
title.en = "Check the output"
title.de = "Ausgabe prüfen"
text.en = """
A checker walks the result. A broken link or anchor, a wrong number of h1 headings, a wrong language, missing
navigation or theme contrast below 4.5:1 **fails the build**.
"""
text.de = """
Ein Prüfprogramm geht das Ergebnis durch. Ein kaputter Link oder Anker, eine falsche Anzahl von h1-Überschriften, eine
falsche Sprache, fehlende Navigation oder ein Theme-Kontrast unter 4,5:1 **lässt den Build scheitern**.
"""
nodes = ["generator", "checks"]
edges = ["to-checks"]
badge = { node = "checks", text.en = "FAILS THE BUILD", text.de = "STOPPT DEN BUILD" }

[[flow.steps]]
id = "deploy"
title.en = "Push to deploy"
title.de = "Deployment per Push"
text.en = """
On a push to main, GitHub Actions runs the tests, the build and the checker again and publishes only if
**all of them pass**.
"""
text.de = """
Bei einem Push auf main führt GitHub Actions Tests, Build und Prüfprogramm erneut aus und veröffentlicht nur, wenn
**alles besteht**.
"""
nodes = ["checks", "ci", "pages"]
edges = ["to-ci", "to-pages"]
badge = { node = "ci", text.en = "ONLY IF GREEN", text.de = "NUR BEI GRÜN" }

[[flow.steps]]
id = "open"
title.en = "Open the gallery"
title.de = "Galerie öffnen"
text.en = """
A reviewer opens a demo. The page is plain pre-rendered HTML that a small script upgrades with reveals, parallax,
counters and page transitions.
"""
text.de = """
Wer prüft, öffnet eine Demo. Die Seite ist schlichtes, vorab erzeugtes HTML, das ein kleines Skript um
Einblendungen, Parallaxe, Zähler und Seitenübergänge erweitert.
"""
nodes = ["pages", "motion"]
edges = ["to-motion"]

