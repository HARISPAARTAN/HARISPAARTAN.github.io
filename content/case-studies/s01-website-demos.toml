component kit and public links.
"""
de = """
Den Auftrag festgelegt und die wichtigsten Weichen gestellt: eine zweisprachige Website, alle acht Seiten, ein Video
im Hero-Bereich, ein Generator mit gemeinsamem Komponenten-Baukasten und öffentliche Links.
"""

[[role.bullets]]
en = "Decided every later revision, from the corporate colours in every demo to the motion system."
de = "Über jede spätere Überarbeitung entschieden, von den Firmenfarben in jeder Demo bis zum Bewegungssystem."

[[role.bullets]]
en = """
Owned the repository, GitHub Pages and the deploy workflow, and released every update to the public gallery.
"""
de = """
Repository, GitHub Pages und Deployment-Ablauf verantwortet und jede Aktualisierung in der öffentlichen Galerie
veröffentlicht.
"""

[[role.bullets]]
en = "Brought the supervisor's choice of reference designs into the project."
de = "Die Vorgaben der Führungskraft zu den Referenzdesigns in das Projekt eingebracht."

[[role.bullets]]
en = "Delivered the six directions as public links for the supervisor's review."
