# ---------------------------------------------------------------------------------------------------------------------
[why]
heading.en = "Comparing designs on real content, and changing course cheaply"
heading.de = "Designs an echtem Inhalt vergleichen und den Kurs mit wenig Aufwand ändern"

[[why.paragraphs]]
en = """
The supervisor wanted to compare design directions for the company website on the real content and all eight pages,
not on placeholders: home, services, projects, company, careers, contact, legal notice and privacy. A direction
therefore had to be a whole site, German by default with an English toggle and a looping video in the hero. 
"""
de = """
Die Führungskraft wollte Designrichtungen für die Firmenwebsite am echten Inhalt und an allen acht Seiten
vergleichen, nicht an Platzhaltern: Startseite, Leistungen, Projekte, Unternehmen, Karriere, Kontakt, Impressum und
Datenschutz. Eine Richtung musste also eine komplette Website sein, standardmäßig auf Deutsch mit einem Schalter für
Englisch und mit einem Video in Endlosschleife im Hero-Bereich. 
"""

[[why.paragraphs]]
en = """
The brief kept changing within about two weeks, and the corporate colours reached every demo in a single commit.
**Changes had to be cheap.** One content source, a shared component kit and a small recipe per demo turn a new
direction or a global change into a small edit, and automatic checks stop a broken link or a missing translation
before it goes online.
"""
de = """
Der Auftrag änderte sich innerhalb von etwa zwei Wochen mehrfach, und die Firmenfarben kamen in einem einzigen Commit
in jede Demo. **Änderungen mussten mit wenig Aufwand möglich sein.** Eine Inhaltsquelle, ein gemeinsamer
Komponenten-Baukasten und ein kleines Rezept pro Demo machen aus einer neuen Richtung oder einer globalen Änderung
eine kleine Anpassung, und automatische Prüfungen stoppen einen kaputten Link oder eine fehlende Übersetzung, bevor
sie online gehen.
"""

[[why.notes]]
title.en = "Who uses it"
title.de = "Wer sie nutzt"
text.en = """
The supervisor, who picks a direction, and the reviewers who have the link. The gallery is public but not indexed by
search engines.
"""
text.de = """
Die Führungskraft, die eine Richtung auswählt, und die Prüfenden, die den Link haben. Die Galerie ist öffentlich,
wird aber von Suchmaschinen nicht indexiert.
"""

[[why.notes]]
title.en = "What it costs to run"
title.de = "Was der Betrieb kostet"
text.en = """
Nothing: static files on GitHub Pages, no backend, no cookies and no analytics, so there are no visitor figures
either.
"""
text.de = """
Nichts: statische Dateien auf GitHub Pages, kein Backend, keine Cookies und keine Analyse, es gibt also auch keine
Besucherzahlen.
"""

