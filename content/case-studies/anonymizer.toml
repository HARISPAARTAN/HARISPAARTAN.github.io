[decisions]

[[decisions.items]]
title.en = "Remove the content, then prove it"
title.de = "Erst entfernen, dann nachweisen"
text.en = "The tool deletes text, covered pixels and hidden parts from a copy and writes a whole new file, instead of only drawing black boxes. A separate check then re-opens the saved copy and searches it four ways. The price is time: OCR reads every page at check time."
text.de = "Das Werkzeug löscht Text, überdeckte Bildpunkte und versteckte Teile in einer Kopie und schreibt eine komplett neue Datei, statt nur schwarze Balken zu zeichnen. Eine eigene Prüfung öffnet die gespeicherte Kopie danach neu und durchsucht sie auf vier Wegen. Der Preis ist Zeit: Die OCR liest bei der Prüfung jede Seite."

[[decisions.items]]
title.en = "The tool suggests, a person decides"
title.de = "Das Werkzeug schlägt vor, ein Mensch entscheidet"
text.en = "Offline name recognition is imperfect, so every batch goes through a mandatory preview. Everything found is pre-ticked, and nothing is written before the user presses “Redact”. The price is a person's attention on every batch, and the page view exists for PDF only."
text.de = "Namenserkennung ohne Internet ist nicht perfekt, deshalb läuft jeder Stapel durch eine verpflichtende Vorschau. Alles Gefundene ist vorab angehakt, und geschrieben wird erst nach Klick auf „Schwärzen“. Der Preis: Jeder Stapel braucht die Aufmerksamkeit eines Menschen, und die Seitenansicht gibt es nur für PDF."

[[decisions.items]]
title.en = "Office files are edited as XML"
title.de = "Office-Dateien werden als XML bearbeitet"
text.en = "Word, PowerPoint and Excel files are opened as packages and edited part by part, so format and layout stay as they were. The price is the largest module of the tool, which has to know every place text can hide."
text.de = "Word-, PowerPoint- und Excel-Dateien werden als Pakete geöffnet und Teil für Teil bearbeitet, damit Format und Layout erhalten bleiben. Der Preis ist das größte Modul des Werkzeugs, das jeden Ort kennen muss, an dem sich Text verstecken kann."

[[decisions.items]]
title.en = "Offline and portable, models inside"
title.de = "Offline und portabel, Modelle inklusive"
text.en = "The tool is one folder with the language and OCR models inside: no installation and no internet. The price is size and platform: about 460 MB unpacked and Windows only."
text.de = "Das Werkzeug ist ein einziger Ordner mit den Sprach- und OCR-Modellen darin: ohne Installation und ohne Internet. Der Preis sind Größe und Plattform: etwa 460 MB entpackt und nur Windows."

[role]

[[role.bullets]]
en = "Designed the tool from the written brief and decided the trade-offs above."
de = "Das Werkzeug nach dem schriftlichen Auftrag entworfen und die Abwägungen oben entschieden."

[[role.bullets]]
en = "Built the release process: a portable Windows folder, a self-test that must pass before the zip is made, and five releases from v1.0 to v1.3."
de = "Den Release-Ablauf gebaut: ein portabler Windows-Ordner, ein Selbsttest, der bestanden sein muss, bevor die Zip-Datei entsteht, und fünf Releases von v1.0 bis v1.3."

[[role.bullets]]
en = "Tested the quality check on a set of real sample documents and tuned it; the false alarms and over-redaction it exposed were fixed in v1.2.1."
de = "Die Qualitätsprüfung an einem Satz echter Beispieldokumente getestet und abgestimmt; die dabei sichtbar gewordenen Fehlalarme und das übermäßige Schwärzen wurden in v1.2.1 behoben."

[[role.bullets]]
en = "Designed the look in the S01 corporate style (colours, fonts, launch screen) and built the clickable demo, which shows a made-up company and invented documents."
de = "Das Erscheinungsbild im Corporate Design von S01 gestaltet (Farben, Schriften, Startbildschirm) und die klickbare Demo gebaut, die eine fiktive Firma und erfundene Dokumente zeigt."

[result]
heading.en = "Version 1.3 delivered on 20 October 2026"
heading.de = "Version 1.3 geliefert am 20. Oktober 2026"
text.en = "**Delivered as a portable Windows folder** (about 200 MB zipped) with a German quick guide; version 1.3 is the fifth release. The code base has 106 automated tests, and the build stops if its built-in self-test fails."
text.de = "**Geliefert als portabler Windows-Ordner** (gezippt etwa 200 MB) mit deutscher Kurzanleitung; Version 1.3 ist das fünfte Release. Die Codebasis hat 106 automatisierte Tests, und der Build bricht ab, wenn sein eingebauter Selbsttest fehlschlägt."
