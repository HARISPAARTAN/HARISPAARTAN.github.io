[[flow.steps]]
id = "name"
title.en = "Name the client"
title.de = "Kunden benennen"
text.en = "The user types in the client's names, or lets the tool **detect the companies** in the chosen files. Several clients can be handled in one run."
text.de = "Die Kundennamen werden eingetippt, oder das Programm **erkennt die Firmen** in den gewählten Dateien. Mehrere Kunden lassen sich in einem Durchgang bearbeiten."
nodes = ["gui", "detect"]
edges = ["gui-detect"]
badge = { node = "detect", text = "OFFLINE" }

[[flow.steps]]
id = "scan"
title.en = "Scan every file"
title.de = "Jede Datei durchsuchen"
text.en = "Each file is searched for **client spellings**, personal data (names, e-mail, phone, signature lines), abbreviations, document zones, logos and metadata. Scanned pages and images are read by OCR."
text.de = "Jede Datei wird nach **Schreibweisen des Kundennamens**, personenbezogenen Daten (Namen, E-Mail, Telefon, Unterschriftszeilen), Abkürzungen, Dokumentbereichen, Logos und Metadaten durchsucht. Gescannte Seiten und Bilder liest die Texterkennung (OCR)."
nodes = ["gui", "pipeline", "handlers", "detect", "ocr"]
edges = ["gui-pipeline", "pipeline-handlers", "handlers-detect", "handlers-ocr"]

[[flow.steps]]
id = "review"
title.en = "Review the findings"
title.de = "Fundstellen prüfen"
text.en = "Everything found is **pre-ticked** in a mandatory preview. The user unticks, keeps single spots, draws boxes, adds a missed term and ticks any image to remove; signature images are not found automatically."
text.de = "Alles Gefundene ist in einer verpflichtenden Vorschau **vorab angehakt**. Wer prüft, nimmt Haken heraus, lässt einzelne Stellen stehen, zieht Rahmen auf, ergänzt einen übersehenen Begriff und hakt Bilder zum Entfernen an; Unterschriftsbilder werden nicht automatisch gefunden."
nodes = ["pipeline", "gui"]
edges = ["pipeline-gui"]
badge = { node = "gui", text.en = "MANDATORY", text.de = "PFLICHT" }

[[flow.steps]]
id = "remove"
title.en = "Remove for good"
title.de = "Endgültig entfernen"
text.en = "On a copy, text, covered pixels, logos, metadata, comments and hidden parts are **deleted**, not just covered. In Word, PowerPoint and Excel files every removed character is replaced by a solid block."
text.de = "Auf einer Kopie werden Text, überdeckte Bildpunkte, Logos, Metadaten, Kommentare und versteckte Teile **gelöscht**, nicht nur abgedeckt. In Word-, PowerPoint- und Excel-Dateien wird jedes entfernte Zeichen durch einen ausgefüllten Block ersetzt."
nodes = ["gui", "pipeline", "handlers"]
edges = ["gui-pipeline", "pipeline-handlers"]
badge = { node = "pipeline", text.en = "ON A COPY", text.de = "AUF KOPIE" }

[[flow.steps]]
id = "check"
title.en = "Check the saved copy"
title.de = "Gespeicherte Kopie prüfen"
text.en = "The saved file is **re-opened** and searched four ways: text and internal objects, OCR of every page and image, hidden content, removed images. For Word, PowerPoint and Excel, OCR reads embedded images only."
text.de = "Die gespeicherte Datei wird **neu geöffnet** und auf vier Wegen durchsucht: Text und interne Objekte, OCR jeder Seite und jedes Bildes, versteckte Inhalte, entfernte Bilder. Bei Word, PowerPoint und Excel liest die OCR nur eingebettete Bilder."
nodes = ["handlers", "qc", "ocr"]
edges = ["handlers-qc", "qc-ocr"]
badge = { node = "qc", text.en = "4 CHECKS", text.de = "4 PRÜFUNGEN" }

[[flow.steps]]
id = "report"
title.en = "Name it and report"
title.de = "Benennen und berichten"
text.en = "A **passing copy** gets the suffix _ANON, a failing one _ANON_QC-FAILED. An HTML report lists every file with PASS or FAIL and shows the client terms masked."
text.de = "Eine **bestandene Kopie** erhält das Suffix _ANON, eine durchgefallene _ANON_QC-FAILED. Ein HTML-Bericht listet jede Datei mit OK oder NICHT OK und zeigt die gesuchten Begriffe maskiert."
nodes = ["qc", "pipeline", "report", "gui"]
edges = ["qc-pipeline", "pipeline-report", "pipeline-gui"]

