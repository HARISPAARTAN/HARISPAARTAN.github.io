[why]
heading.en = "Covering a name is not the same as removing it"
heading.de = "Einen Namen abzudecken heißt nicht, ihn zu entfernen"

[[why.paragraphs]]
en = """
Client documents have to be anonymized in bulk before they leave the company. A client does not appear only as a name:
it hides in spellings and abbreviations, in people, signatures and logos, in running headers and revision tables, and in
the metadata of the file.
"""
de = """
Kundendokumente müssen gebündelt anonymisiert werden, bevor sie das Unternehmen verlassen. Der Kundenbezug steckt nicht
nur im Namen: Er verbirgt sich in Schreibweisen und Abkürzungen, in Personen, Unterschriften und Logos, in Kopfzeilen und
Änderungstabellen und in den Metadaten der Datei.
"""

[[why.paragraphs]]
en = """
**Covering is not removing.** A black box can be taken away again, the text under it can be copied, extracted or read by
OCR, and the PDF objects still hold the original. The tool therefore deletes the content itself, so that none of these
routes brings it back.
"""
de = """
**Abdecken ist nicht Entfernen.** Ein schwarzer Balken lässt sich wieder wegnehmen, der Text darunter lässt sich kopieren, extrahieren oder per OCR erkennen, und die PDF-Objekte enthalten das Original weiterhin. Das Werkzeug löscht den
Inhalt deshalb selbst, damit keiner dieser Wege ihn zurückbringt.
"""

[[why.paragraphs]]
en = """
A result also has to be checked, not trusted: every output is re-opened and searched again before it counts as
finished. And because the documents are confidential, the whole tool works offline.
"""
de = """
Ein Ergebnis muss außerdem geprüft statt vorausgesetzt werden: Jede Ausgabe wird neu geöffnet und erneut durchsucht,
bevor sie als fertig gilt. Und weil die Dokumente vertraulich sind, arbeitet das gesamte Werkzeug offline.
"""

