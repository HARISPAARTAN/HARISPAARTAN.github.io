[model]
heading.en = "How the records relate in SharePoint"
heading.de = "Wie die Datensätze in SharePoint zusammenhängen"
description.en = """
A company has many contacts and many leads, as end client or as intermediary. A contact is the main contact of many leads
and can also be a further contact on many leads. A lead has many history entries, tasks, files and links. Quarter results
are counted from the records and kept as rows of their own.
"""
description.de = """
Eine Firma hat viele Kontakte und viele Leads, als Endkundenfirma oder als Vermittlungsfirma. Ein Kontakt ist Hauptkontakt vieler Leads
und kann bei vielen Leads zusätzlich als weiterer Kontakt geführt werden. Ein Lead hat viele Verlaufseinträge, Aufgaben,
Dateien und Links. Quartalsergebnisse werden aus den Datensätzen gezählt und als eigene Zeilen abgelegt.
"""
caption.en = """
Simplified: seven boxes stand for eight of the 17 SharePoint objects (Files and links combine a library and a list). Not
drawn: events, market research and rate benchmarks (same pattern), the OKR list, four provisioned lists that no screen
uses, and the app library (code, not data). This is version 2; version 1 had 14 lists.
"""
caption.de = """
Vereinfacht: Sieben Kästen stehen für acht der 17 SharePoint-Objekte (Dateien und Links vereinen eine Bibliothek und eine
Liste). Nicht gezeichnet: Veranstaltungen, Marktbeobachtung und Tagessatz-Vergleichswerte (gleiches Muster), die OKR-Liste,
vier angelegte Listen, die keine Ansicht nutzt, und die App-Bibliothek (Code, keine Daten). Das ist Version 2; Version 1
hatte 14 Listen.
"""

