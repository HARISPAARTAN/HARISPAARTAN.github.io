# ---------------------------------------------------------------------------------------------------------------------
[why]
heading.en = "A prototype that kept its data in one browser"
heading.de = "Ein Prototyp, dessen Daten in einem einzigen Browser lagen"

[[why.paragraphs]]
en = """
The CRM began as the supervisor's single-file HTML prototype: leads, contacts and follow-ups on one page, with the data in
the local storage of one browser. There was no shared store, and a backup meant a manual export.
"""
de = """
Das CRM begann als HTML-Prototyp der Führungskraft in einer einzigen Datei: Leads, Kontakte und Wiedervorlagen auf einer
Seite, die Daten im lokalen Speicher eines einzelnen Browsers. Einen gemeinsamen Datenspeicher gab es nicht, und eine
Sicherung bedeutete manuellen Export.
"""

[[why.paragraphs]]
en = """
There was no sanctioned way to run it inside the company's Microsoft 365. SharePoint switches custom scripts off again
within 24 hours, the company has no premium licence for Power Apps, and a canvas app could not reproduce the approved
design. A **SharePoint Framework web part** is the supported route, so I compared the options and decided on it.
"""
de = """
Es gab keinen zulässigen Weg, ihn im Microsoft 365 des Unternehmens zu betreiben. SharePoint schaltet benutzerdefinierte
Skripte innerhalb von 24 Stunden wieder ab, das Unternehmen hat keine Premium-Lizenz für Power Apps, und eine Canvas-App
konnte das freigegebene Design nicht abbilden. Der unterstützte Weg ist ein **SharePoint-Framework-Webpart**; ich habe die
Optionen verglichen und mich dafür entschieden.
"""

[[why.paragraphs]]
en = """
Enquiries arrive as e-mails and agency job ads, and typing them in again is slow, so the app reads a pasted e-mail and
proposes company, contact and lead. Follow-ups used to depend on memory; now **a lead without an open next step is
flagged**.
"""
de = """
Anfragen kommen als E-Mails und als Projektanzeigen von Personalagenturen, und sie neu abzutippen dauert; deshalb liest die
App eine eingefügte E-Mail und schlägt Firma, Kontakt und Lead vor. Das Nachfassen hing früher am Gedächtnis; jetzt wird
**ein Lead ohne offenen nächsten Schritt markiert**.
"""

[[why.notes]]
title.en = "Who uses it"
title.de = "Wer es nutzt"
text.en = """
Built for one day-to-day user, the practice owner; the app has no user roles. The supervisor approves each release and is
the only person who uploads one.
"""
text.de = """
Gebaut für eine Person im Tagesgeschäft: die Inhaberin oder den Inhaber der Beratung. Die App unterscheidet keine Rollen.
Die Führungskraft gibt jedes Release frei; nur sie lädt es hoch.
"""

[[why.notes]]
title.en = "What it costs to run"
title.de = "Was der Betrieb kostet"
text.en = "Nothing beyond Microsoft 365: no server, no extra licence, and nothing leaves the tenant."
text.de = "Nichts über Microsoft 365 hinaus: kein Server, keine zusätzliche Lizenz, und nichts verlässt den Tenant."

