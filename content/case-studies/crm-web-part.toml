[flow]
heading.en = "How the web part loads, runs and saves"
heading.de = "Wie das Webpart lädt, läuft und speichert"
description.en = """
A loader web part on the CRM page asks the app library for the newest app file and starts it. The app keeps its records in
a store in memory and saves changes in order through a REST adapter into the lists and the files library. Provisioning
scripts set up the lists, libraries and page.
"""
description.de = """
Ein Loader-Webpart auf der CRM-Seite fragt die App-Bibliothek nach der neuesten App-Datei und startet sie. Die App hält ihre
Datensätze in einem Store im Arbeitsspeicher und speichert Änderungen der Reihe nach über einen REST-Adapter in die Listen
und die Dateiablage. Einrichtungsskripte legen Listen, Bibliotheken und Seite an.
"""

