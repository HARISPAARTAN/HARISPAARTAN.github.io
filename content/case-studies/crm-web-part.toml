[[role.bullets]]
en = "Compared the routes (Power Apps code apps, hosted HTML, a canvas app, an external site), decided on SPFx on SharePoint lists and wrote down why."
de = "Die Lösungswege verglichen (Power-Apps-Code-Apps, gehostetes HTML, Canvas-App, externe Website), mich für SPFx auf SharePoint-Listen entschieden und die Gründe festgehalten."

[[role.bullets]]
en = "Built the SharePoint layer in strict TypeScript, with the REST adapter, the persister with retries and rollback, and the file store, and tested it with 39 unit tests."
de = "Die SharePoint-Schicht in striktem TypeScript gebaut, mit REST-Adapter, Persister samt Wiederholungen und Rollback sowie Dateiablage, und mit 39 Unit-Tests getestet."

[[role.bullets]]
en = "Built the loader web part and the release mechanism, and wrote the PnP PowerShell scripts that set up the site and verify it against the schema."
de = "Das Loader-Webpart und den Release-Mechanismus gebaut und die PnP-PowerShell-Skripte geschrieben, die die Site einrichten und gegen das Schema prüfen."

[[role.bullets]]
en = "Ported the supervisor's prototype, which supplies the product design, screens and business rules, and kept it current from revision 18 to revision 48 and through the feedback of 14 October 2026; added SharePoint storage, German and English, the phone layout and a sandbox."
de = "Den Prototyp der Führungskraft übernommen, der Produktentwurf, Ansichten und Geschäftsregeln liefert, und ihn von Revision 18 bis Revision 48 sowie durch die Rückmeldungen vom 14. Oktober 2026 aktuell gehalten; SharePoint-Speicherung, Deutsch und Englisch, das Smartphone-Layout und eine Sandbox ergänzt."

[[role.bullets]]
en = "Extended the e-mail reader so that it also understands agency job ads."
de = "Die E-Mail-Erkennung erweitert, sodass sie auch Projektanzeigen von Personalagenturen versteht."

[[role.bullets]]
en = "Wrote the documentation (concept, handover, data model in German and English, release procedure, go-live checklist, test plan, release notes) and acted as interim site owner for the go-live."
de = "Die Dokumentation geschrieben (Konzept, Übergabe, Datenmodell auf Deutsch und Englisch, Release-Ablauf, Go-live-Checkliste, Testplan, Release Notes) und für den Go-live vorübergehend die Site-Eigentümerrolle übernommen."

