[[model.notes]]
title.en = "One app key per record"
title.de = "Ein App-Schlüssel pro Datensatz"
text.en = """
Every record has its own app key, so SharePoint IDs stay internal and links survive renames. History, tasks, files and
links point at any record by its kind plus app key.
"""
text.de = """
Jeder Datensatz hat einen eigenen App-Schlüssel. So bleiben die SharePoint-IDs intern, und Verknüpfungen überstehen
Umbenennungen. Verlauf, Aufgaben, Dateien und Links zeigen über Art und App-Schlüssel auf jeden beliebigen Datensatz.
"""

[[model.notes]]
title.en = "Stable names, German labels"
title.de = "Feste Namen, deutsche Bezeichnungen"
text.en = """
Technical names never change; German display names sit on top, so lists and columns can be renamed without breaking the
app.
"""
text.de = """
Technische Namen ändern sich nie; deutsche Anzeigenamen liegen darüber, sodass sich Listen und Spalten umbenennen lassen,
ohne die App zu stören.
"""

[[model.notes]]
title.en = "Figures are counted, then frozen"
title.de = "Kennzahlen: gezählt, dann eingefroren"
text.en = """
The hit ratio is the share of won leads among the won and lost leads of the period; withdrawn leads are left out. Closing
a quarter freezes the figures into one row of quarter results.
"""
text.de = """
Die Trefferquote ist der Anteil gewonnener Leads an allen gewonnenen und verlorenen Leads des Zeitraums; zurückgezogene
Leads bleiben außen vor. Beim Abschluss eines Quartals werden die Zahlen in einer Zeile der Quartalsergebnisse eingefroren.
"""

