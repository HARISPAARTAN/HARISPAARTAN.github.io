A CRM for a small consultancy, built as a SharePoint Framework web part: leads, companies, contacts, tasks and reports are
stored in SharePoint lists, and the whole app is one numbered file that a small loader picks up from a library. The
product design, screens and business rules come from the supervisor's HTML prototype; I decided the route, built the
