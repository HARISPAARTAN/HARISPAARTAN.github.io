[decisions]

[[decisions.items]]
title.en = "A tiny loader and one versioned app file"
title.de = "Ein kleiner Loader und eine versionierte App-Datei"
text.en = """
Only a 17 KB loader web part goes through the tenant's app catalog, installed once by an administrator. The CRM itself is
one numbered file in a site library: uploading it is the release, deleting it is the rollback, and schema changes only
ever add. **Trade-off:** that library's write permission has to be locked down.
"""
text.de = """
Nur ein Loader-Webpart von 17 KB läuft über den App-Katalog des Tenants und wird einmalig von der Administration
installiert. Das CRM selbst ist eine nummerierte Datei in einer Bibliothek der Site: Hochladen ist das Release, Löschen
der Rollback, und Schemaänderungen fügen immer nur hinzu. **Abwägung:** Die Schreibrechte auf diese Bibliothek müssen
streng eingeschränkt werden.
"""

[[decisions.items]]
title.en = "SharePoint lists as the database"
title.de = "SharePoint-Listen als Datenbank"
text.en = """
Lists with stable technical names, German display names on top and an app-generated key per record: no external hosting,
no server, no extra licence. **Trade-off:** the app has to enforce integrity itself, it assumes one writer at a time, and
the last write wins.
"""
text.de = """
Listen mit festen technischen Namen, deutschen Anzeigenamen darüber und einem von der App erzeugten Schlüssel pro
Datensatz: kein externes Hosting, kein Server, keine zusätzliche Lizenz. **Abwägung:** Die App muss die Integrität selbst
sichern, sie geht von einer schreibenden Person zur Zeit aus, und der letzte Schreibvorgang gewinnt.
"""

[[decisions.items]]
title.en = "Optimistic saving with a diff-based persister"
title.de = "Optimistisch speichern, nur Änderungen senden"
text.en = """
Every change lands in the in-memory store first and the screen redraws at once; a persister then compares before and after
and sends only the changed columns, in order, in the background. **Trade-off:** a failed save is noticed late, as a
message and a rollback of that one record.
"""
text.de = """
Jede Änderung landet zuerst im Store im Arbeitsspeicher, und der Bildschirm zeichnet sofort neu; ein Persister vergleicht
dann Vorher und Nachher und sendet nur die geänderten Spalten, der Reihe nach im Hintergrund. **Abwägung:** Ein
fehlgeschlagenes Speichern fällt erst spät auf, als Meldung und mit dem Zurücksetzen dieses einen Datensatzes.
"""

[[decisions.items]]
title.en = "Port the prototype, don't rewrite it"
title.de = "Prototyp übernehmen statt neu schreiben"
text.en = """
No framework, a Shadow DOM and translation by dictionary, so the approved design appears exactly and later revisions of the
prototype stay mergeable. **Trade-off:** most of the code is the ported prototype and is not type-checked.
"""
text.de = """
Kein Framework, ein Shadow DOM und Übersetzung per Wörterbuch: So erscheint das freigegebene Design exakt, und spätere
Überarbeitungen des Prototyps lassen sich weiter einspielen. **Abwägung:** Der größte Teil des Codes ist der übernommene
Prototyp und nicht typgeprüft.
"""

