[[flow.steps]]
id = "setup"
title.en = "Set up the site"
title.de = "Site einrichten"
text.en = "The PnP PowerShell scripts create the lists, libraries, navigation and page. A verify script then checks the site against the schema."
text.de = "Die PnP-PowerShell-Skripte legen Listen, Bibliotheken, Navigation und Seite an. Ein Prüfskript vergleicht die Site anschließend mit dem Schema."
nodes = ["prov", "lists", "files", "library"]
edges = ["setup_lists", "setup_files", "setup_lib"]

[[flow.steps]]
id = "open"
title.en = "Open the CRM page"
title.de = "CRM-Seite öffnen"
text.en = "The loader asks the app library for its files and picks the **highest-numbered** app file."
text.de = "Der Loader fragt die App-Bibliothek nach ihren Dateien und wählt die App-Datei mit der **höchsten Nummer**."
nodes = ["loader", "library"]
edges = ["ask", "answer"]

[[flow.steps]]
id = "start"
title.en = "Start the app"
title.de = "App starten"
text.en = "The loader runs that file inside a **Shadow DOM**, and the app reads every list in parallel through the REST adapter."
text.de = "Der Loader führt diese Datei in einem **Shadow DOM** aus, und die App liest alle Listen parallel über den REST-Adapter."
nodes = ["loader", "app", "adapter", "lists", "files"]
edges = ["start", "read", "to_lists", "to_files"]

[[flow.steps]]
id = "work"
title.en = "Work in the CRM"
title.de = "Im CRM arbeiten"
text.en = "Edits go to the in-memory **store**, which checks the rules and redraws the screen at once."
text.de = "Änderungen gehen in den **Store** im Arbeitsspeicher, der die Regeln prüft und den Bildschirm sofort neu zeichnet."
nodes = ["app", "store"]
edges = ["edit", "redraw"]

[[flow.steps]]
id = "save"
title.en = "Save in the background"
title.de = "Im Hintergrund speichern"
text.en = "The persister sends changes to SharePoint **in order**, with up to three tries. If SharePoint refuses a record, it is rolled back and SharePoint's message is shown."
text.de = "Der Persister sendet Änderungen **der Reihe nach** an SharePoint, mit bis zu drei Versuchen. Lehnt SharePoint einen Datensatz ab, wird er zurückgesetzt und die Meldung von SharePoint angezeigt."
nodes = ["store", "adapter", "lists", "files"]
edges = ["save", "to_lists", "to_files"]
badge = { node = "store", text.en = "MAX 3 TRIES", text.de = "MAX. 3 VERSUCHE", pos = "center" }

[[flow.steps]]
id = "ship"
title.en = "Ship a new version"
title.de = "Neue Version ausliefern"
text.en = "The supervisor drops the next numbered file into the library. The next page open runs it, and **deleting it is the rollback**."
text.de = "Die Führungskraft legt die nächste nummerierte Datei in der Bibliothek ab. Beim nächsten Öffnen der Seite läuft sie, und **Löschen ist der Rollback**."
nodes = ["library", "loader", "app"]
edges = ["answer", "start"]
badge = { node = "library", text.en = "UPLOAD = RELEASE", text.de = "HOCHLADEN = RELEASE" }

