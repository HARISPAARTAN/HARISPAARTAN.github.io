version 2 is built and packaged.**
"""
lead.de = """
Ein CRM für eine kleine Beratung, gebaut als SharePoint-Framework-Webpart: Leads, Firmen, Kontakte, Aufgaben und Berichte
liegen in SharePoint-Listen, und die ganze App ist eine nummerierte Datei, die ein kleiner Loader aus einer Bibliothek
holt. Produktentwurf, Ansichten und Geschäftsregeln stammen aus dem HTML-Prototyp der Führungskraft; ich habe den
Lösungsweg entschieden, die SharePoint-Schicht, den Loader und die Einrichtungsskripte gebaut und das CRM ausgeliefert.
**Version 1 ist seit September 2026 live; Version 2 ist gebaut und paketiert.**
"""

