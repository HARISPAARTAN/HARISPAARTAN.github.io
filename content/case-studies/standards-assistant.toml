Ein Prototyp, der Prüfenden auf der Baustelle Fragen auf Deutsch aus vier technischen Richtlinien beantwortet und bei
jeder Quelle Dokument, Kapitel und gedruckte Seite nennt. Kein Produkt liefert Kapitel und Seite von sich aus; deshalb
habe ich aus den Inhaltsverzeichnissen der Richtlinien ein Kapitelregister gebaut und ein Zitat-Thema, das es nutzt.
"""

