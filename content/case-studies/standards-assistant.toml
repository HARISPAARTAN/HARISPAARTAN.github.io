text.en = "1 document → many citations, matched by file name"
text.de = "1 Dokument → viele Zitate, zugeordnet über den Dateinamen"

[[model.relations]]
from = "indexrow"
to = "citation"
cardinality = "one-to-many"
wide = ["indexrow.right", "citation.bottom"]
text.en = "1 index row → many citations, matched when the answer is made (no stored key)"
text.de = "1 Registerzeile → viele Zitate, zugeordnet beim Antworten (kein gespeicherter Schlüssel)"

[[model.notes]]
title.en = "Three page numbers per row"
title.de = "Drei Seitenzahlen pro Zeile"
text.en = "Each index row carries the printed page (what the inspector reads), the PDF page and the link page (how Copilot counts). They can all differ: in an invented example, printed page 41 is PDF page 43 and link page 40."
text.de = "Jede Registerzeile trägt die gedruckte Seite (was man auf der Seite liest), die PDF-Seite und die Link-Seite (so zählt Copilot). Alle drei können abweichen: In einem erfundenen Beispiel ist die gedruckte Seite 41 die PDF-Seite 43 und die Link-Seite 40."

[[model.notes]]
title.en = "Heading-only chapters are skipped"
title.de = "Reine Überschriften werden übersprungen"
text.en = "188 chapters consist of a heading with no body text. The lookup skips them, and they become the “not contained” test questions."
text.de = "188 Kapitel bestehen nur aus einer Überschrift ohne Text. Die Abfrage überspringt sie, und sie werden zu den Testfragen für „nicht enthalten“."

[[model.notes]]
title.en = "Locations, never the standards' text"
title.de = "Fundstellen, nie der Text der Normen"
text.en = "The index stores where something is, never what it says. The text stays in the PDFs, so nothing from the standards is copied into the list."
text.de = "Das Register speichert, wo etwas steht, nie, was dort steht. Der Text bleibt in den PDFs; aus den Normen wird nichts in die Liste kopiert."


[decisions]
[[decisions.items]]
title.en = "Pilot on Copilot Studio"
title.de = "Pilot auf Copilot Studio"
text.en = "It is the fastest Microsoft route, it links to pages and it keeps the data in Germany. Azure AI Foundry stays an optional stage 2, and the Claude API an alternative only if processing in the USA is cleared. **Trade-off:** page markers are not guaranteed on every citation, and the agent is planned to live in Teams, not inside the QS Baustelle app."
text.de = "Es ist der schnellste Microsoft-Weg, verlinkt auf Seiten und hält die Daten in Deutschland. Azure AI Foundry bleibt eine optionale Stufe 2, die Claude-API nur dann eine Alternative, wenn die Verarbeitung in den USA freigegeben wird. **Abwägung:** Seitenmarken sind nicht bei jeder Quellenangabe garantiert, und der Agent soll in Teams laufen, nicht in der App QS Baustelle."

[[decisions.items]]
title.en = "A chapter index from each document's own table of contents"
title.de = "Kapitelregister aus dem Inhaltsverzeichnis jedes Dokuments"
text.en = "Chapters and printed page numbers come from the table of contents, and every entry that is not found in the text is reported (0 of 421). **Trade-off:** one build step per new document, and the documents need a table of contents."
text.de = "Kapitel und gedruckte Seitenzahlen stammen aus dem Inhaltsverzeichnis, und jeder Eintrag, der im Text nicht zu finden ist, wird gemeldet (0 von 421). **Abwägung:** ein Bauschritt pro neuem Dokument, und die Dokumente brauchen ein Inhaltsverzeichnis."

[[decisions.items]]
title.en = "The PDFs as the only knowledge source, locations in a lean list"
title.de = "Die PDFs als einzige Wissensquelle, Fundstellen in einer schlanken Liste"
text.en = "Chapter and printed page are looked up in a lean list that holds locations only. The PDFs stay the single source of text, and the page link stays the native one. **Trade-off:** a separate link-page range is needed, and every inspector needs read access to the list."
text.de = "Kapitel und gedruckte Seite werden in einer schlanken Liste nachgeschlagen, die nur Fundstellen enthält. Die PDFs bleiben die einzige Textquelle, und der Seitenlink kommt weiter direkt von Copilot Studio. **Abwägung:** Es braucht einen eigenen Bereich für die Link-Seiten, und alle Prüfenden brauchen Lesezugriff auf die Liste."

[[decisions.items]]
title.en = "Answer only from the documents"
title.de = "Nur aus den Dokumenten antworten"
text.en = "Ungrounded answers, general knowledge and the web are switched off, a custom fallback says “not contained in the documents”, and “not contained” test questions check it. **Trade-off:** clarifying questions are suppressed, and only one negative test has a recorded result."
text.de = "Antworten ohne Beleg, Allgemeinwissen und Websuche sind abgeschaltet, eine eigene Fallback-Antwort sagt „nicht in den Dokumenten enthalten“, und Testfragen zu „nicht enthalten“ prüfen das. **Abwägung:** Rückfragen werden unterdrückt, und nur ein Negativtest hat ein festgehaltenes Ergebnis."

[[decisions.items]]
title.en = "Side topic: an invoice-archiving flow repaired"
title.de = "Nebenthema: ein Rechnungsarchiv-Flow repariert"
text.en = "Separate from the assistant, documented in August 2026. An existing Power Automate flow renamed receipts from their metadata and moved them to an archive, and kept failing after about 25 minutes. **The cause was a single supplier value that contains a slash**, which SharePoint reads as a folder separator. The fix cleans every name part, skips folders, reports skipped files and keeps the runs sequential. Tested on real documents; notes for the move to production are written, and a proposed audit log is still an open request."
text.de = "Getrennt vom Assistenten, dokumentiert im August 2026. Ein bestehender Power-Automate-Flow benannte Belege nach ihren Metadaten um und verschob sie in ein Archiv, scheiterte aber immer wieder nach etwa 25 Minuten. **Ursache war ein einziger Lieferantenwert mit einem Schrägstrich**, den SharePoint als Ordnertrenner liest. Die Korrektur bereinigt jeden Namensteil, überspringt Ordner, meldet übersprungene Dateien und hält die Läufe nacheinander. An echten Dokumenten getestet; Hinweise für den Umzug in die Produktion sind geschrieben, ein vorgeschlagenes Prüfprotokoll ist noch eine offene Anfrage."

[role]
[[role.bullets]]
en = "Wrote the options paper after a structured research pass: five routes (Copilot Studio, Microsoft 365 Copilot with a SharePoint agent, Azure AI Foundry, the Claude API and AI Builder) rated against the supervisor's requirements, licences, cost, effort and risk, plus a staged plan, eight decisions for the company and an acceptance test."
de = "Das Optionspapier geschrieben, nach einer strukturierten Recherche: fünf Wege (Copilot Studio, Microsoft 365 Copilot mit SharePoint-Agent, Azure AI Foundry, die Claude-API und AI Builder), bewertet nach den Anforderungen der Führungskraft, Lizenzen, Kosten, Aufwand und Risiko, dazu ein Stufenplan, acht Entscheidungen für das Unternehmen und ein Abnahmetest."

[[role.bullets]]
en = "Built the index builder in Python and the import in PowerShell, fixed the import when 48 links exceeded SharePoint's 255-character limit, and had a sample of 32 rows of the first build checked against the rendered PDF pages."
de = "Den Register-Generator in Python und den Import in PowerShell gebaut, den Import repariert, als 48 Links die 255-Zeichen-Grenze von SharePoint überschritten, und eine Stichprobe von 32 Zeilen der ersten Fassung gegen die gerenderten PDF-Seiten prüfen lassen."

[[role.bullets]]
en = "Built and configured the agent: grounded-only settings, fallback message, starter prompts, knowledge folder, lookup tool and citation topic."
de = "Den Agenten gebaut und eingerichtet: Einstellungen, die nur belegte Antworten zulassen, Fallback-Meldung, Startvorschläge, Wissensordner, Abfrage-Werkzeug und Zitat-Thema."

[[role.bullets]]
en = "Found that Copilot's page links skip near-empty pages, and added link-page ranges to the index."
de = "Herausgefunden, dass die Seitenlinks von Copilot fast leere Seiten überspringen, und Link-Seiten-Bereiche ins Register aufgenommen."

[[role.bullets]]
en = "Wrote the build guide, the instructions and the acceptance set (4 positive, 10 negative and 3 photo questions)."
de = "Die Aufbauanleitung, die Anweisungen und die Abnahmefragen geschrieben (4 positive, 10 negative und 3 Fotofragen)."

[[role.bullets]]
en = "Tested the agent with the four case questions the supervisor set, against the chapters the supervisor expected."
de = "Den Agenten mit den vier Fallfragen der Führungskraft getestet, gegen die dazu erwarteten Kapitel."

[result]
heading.en = "A prototype, built in September 2026"
heading.de = "Ein Prototyp, im September 2026 gebaut"
text.en = """
**Tested only in the Copilot Studio test pane; not published and not shared with inspectors.** The options
paper is dated 16 September 2026 and the agent was built between 17 and 21 September. On 21 September the supervisor's
four case questions were answered with the expected chapter and printed page (4 of 4). The source footer appeared in 7
of 9 runs; the two misses went through a system topic that bypasses the citation topic, and that fix is open. Also open:
publishing, a Teams and phone test, the photo questions and the remaining acceptance questions.
"""
text.de = """
**Nur im Testbereich von Copilot Studio geprüft; nicht veröffentlicht und nicht mit den Prüfenden geteilt.** Das
Optionspapier ist auf den 16. September 2026 datiert, der Agent entstand zwischen dem 17. und 21. September. Am 21.
September wurden die vier Fallfragen der Führungskraft mit dem erwarteten Kapitel und der gedruckten Seite beantwortet (4
von 4). Die Quellen-Fußzeile erschien in 7 von 9 Durchläufen; die beiden Ausfälle liefen über ein Systemthema, das das
Zitat-Thema umgeht, und diese Korrektur steht noch aus. Offen sind außerdem die Veröffentlichung, ein Test in Teams und
auf dem Handy, die Fotofragen und die übrigen Abnahmefragen.
"""
