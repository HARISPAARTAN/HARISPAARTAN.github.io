nodes = ["topic", "chat"]
edges = ["e_send"]

[model]
heading.en = "Six objects that link a PDF page to its chapter"
heading.de = "Sechs Objekte, die eine PDF-Seite mit ihrem Kapitel verbinden"
description.en = """
A guideline document has many PDF pages and many chapters. A chapter has one or more index rows, and an index row covers
a range of pages. At run time an answer has zero or more citations; each citation names one document and is matched to
one index row.
"""
description.de = """
Ein Richtliniendokument hat viele PDF-Seiten und viele Kapitel. Ein Kapitel hat eine oder mehrere Registerzeilen, und
eine Registerzeile deckt einen Seitenbereich ab. Zur Laufzeit hat eine Antwort null oder mehr Zitate; jedes Zitat nennt
ein Dokument und wird einer Registerzeile zugeordnet.
"""
caption.en = """
Simplified: 6 of 8 entities. Left out: the test questions and an earlier design's section files. Pages and chapters are
derived from the PDFs; citations and answers exist only at run time. A citation is matched to its document and its index
row when the answer is made, so no key is stored for that link.
"""
caption.de = """
Vereinfacht: 6 von 8 Objekten. Weggelassen: die Testfragen und die Abschnittsdateien eines früheren Entwurfs. Seiten und
Kapitel werden aus den PDFs abgeleitet; Zitate und Antworten gibt es nur zur Laufzeit. Ein Zitat wird erst beim Antworten
seinem Dokument und seiner Registerzeile zugeordnet, für diese Verbindung wird kein Schlüssel gespeichert.
"""

