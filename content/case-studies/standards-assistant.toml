[why]
heading.en = "Inspectors had four PDFs and no way to question them"
heading.de = "Vier PDFs und keine Möglichkeit, sie zu befragen"

[[why.paragraphs]]
en = """
On site, inspectors meet questions that have to be checked against technical guidelines: four PDFs with 356 pages in
all, and no way to ask them anything. The task came from the supervisor, with one hard rule: every answer must name the
document, the chapter and the page, and must not invent anything.
"""
de = """
Auf der Baustelle tauchen Fragen auf, die gegen technische Richtlinien geprüft werden müssen: vier PDFs mit zusammen
356 Seiten und keine Möglichkeit, ihnen eine Frage zu stellen. Die Aufgabe kam von der Führungskraft, mit einer harten
Regel: Jede Antwort muss Dokument, Kapitel und Seite nennen und darf nichts erfinden.
"""

[[why.paragraphs]]
en = """
**No product does that out of the box.** Copilot Studio links to a page only on one upload path, and not on every
citation. Microsoft 365 Copilot cites whole documents. Azure OpenAI “On Your Data” has no page field and was due to
retire on 14 October 2026. The chapter and page layer therefore had to be built separately.
"""
de = """
**Kein Produkt leistet das von Haus aus.** Copilot Studio verlinkt nur auf einem Upload-Weg eine Seite, und nicht bei
jeder Quellenangabe. Microsoft 365 Copilot zitiert ganze Dokumente. Azure OpenAI „On Your Data“ hat kein Seitenfeld und
sollte am 14. Oktober 2026 eingestellt werden. Die Ebene für Kapitel und Seite musste deshalb eigens gebaut werden.
"""

[[why.paragraphs]]
en = """
Two more things make it hard. “Page” is ambiguous: the printed page number, the PDF page and the page that Copilot's
link counts can all differ. And the guidelines refer to many external standards that they do not contain, so “not
contained in the documents” has to be a proper answer.
"""
de = """
Zwei weitere Dinge erschweren es. „Seite“ ist mehrdeutig: Die gedruckte Seitenzahl, die PDF-Seite und die Seite, die der
Link von Copilot zählt, können alle voneinander abweichen. Und die Richtlinien verweisen auf viele externe Normen, die
sie nicht enthalten; deshalb muss „nicht in den Dokumenten enthalten“ eine vollwertige Antwort sein.
"""

[[why.notes]]
title.en = "Who uses it"
title.de = "Wer ihn nutzt"
text.en = "Planned: the German-speaking site inspectors. Today: only the developer, in the Copilot Studio test pane."
text.de = "Geplant: die deutschsprachigen Prüfenden auf der Baustelle. Heute: nur Testläufe in der Entwicklung, im Testbereich von Copilot Studio."

[[why.notes]]
title.en = "What it costs to run"
title.de = "Was der Betrieb kostet"
text.en = "An estimate, not an invoice: about 30 EUR a month pay-as-you-go, and nothing beyond licences if the inspectors already hold Microsoft 365 Copilot."
text.de = "Eine Schätzung, keine Rechnung: etwa 30 EUR im Monat bei nutzungsabhängiger Abrechnung und nichts über die Lizenzen hinaus, wenn die Prüfenden ohnehin Microsoft 365 Copilot haben."

[flow]
heading.en = "How a question turns into an answer with chapter and page"
heading.de = "Wie aus einer Frage eine Antwort mit Kapitel und Seite wird"
description.en = """
An inspector asks a question in the chat. The assistant agent searches the standards library and drafts an answer. The
citation topic catches the draft and asks the chapter lookup, which queries the chapter index, for the chapter of every
cited page. The answer goes back to the chat with a list of sources. The index builder fills the chapter index once per
document.
"""
description.de = """
Wer prüft, stellt im Chat eine Frage. Der Normen-Agent durchsucht die Normenbibliothek und entwirft eine Antwort. Das
Zitat-Thema fängt den Entwurf ab und fragt über die Kapitel-Abfrage im Kapitelregister nach dem Kapitel jeder zitierten
Seite. Die Antwort geht mit einer Quellenliste zurück in den Chat. Der Register-Generator füllt das Kapitelregister
einmal pro Dokument.
"""

