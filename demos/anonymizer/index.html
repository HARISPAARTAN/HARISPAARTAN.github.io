<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Anonymizer v1.3 · Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* corporate design v1.0 (one visual world, light): sand ground, slate-teal rail, electric yellow-green marks, mono for labels */
:root{
  --teal:#003C50; --teal2:#0B5670; --teal3:#06465C;
  --lime:#E6FF80; --sand:#E6E2DC; --sandstone:#DED0BE; --sky:#D0E6EA; --off:#F6F6F6;
  --urban:#9CA09C; --ink:#262C30; --muted:#545B60; --line:#DAD6CF; --white:#FFFFFF;
  --okbg:#E2F0E4; --okfg:#1D5530; --badbg:#FBE3DF; --badfg:#8E1B12;
  --client:#1C5D8C;
  --sans:"Geist","Aptos","Segoe UI",system-ui,sans-serif;
  --mono:"Sometype Mono","Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
html{background:var(--sand)}
body{background:var(--sand);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.stage{max-width:1360px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.wordmark{font-family:var(--mono);font-weight:700;letter-spacing:.14em;color:rgba(38,44,48,.8);font-size:15px}
.meta{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.ghost{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--white);border:1px solid var(--urban);border-radius:3px;padding:7px 10px;color:var(--ink);cursor:pointer;min-height:32px}
.ghost:hover{background:var(--off)}
.note{margin:0;color:var(--muted);font-size:13px;max-width:90ch;line-height:1.5}

/* window */
.win{background:var(--white);border-radius:8px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 22px 44px -22px rgba(0,40,55,.45);overflow:hidden;border:1px solid #CFCAC2;position:relative}
.titlebar{height:34px;display:flex;align-items:center;gap:10px;padding-left:12px;background:var(--off);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink)}
.ico{width:18px;height:18px;background:var(--teal);color:var(--white);font:700 7px/18px var(--mono);text-align:center;border-radius:2px}
.wc{margin-left:auto;display:flex}
.wc span{width:44px;height:34px;display:grid;place-items:center;color:var(--muted);font-size:12px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:780px}

/* rail */
.rail{background:var(--teal);color:var(--white);display:flex;flex-direction:column;padding:22px 16px 16px;gap:22px;min-width:0}
.brand{display:flex;align-items:center;gap:12px}
.sq{width:40px;height:40px;background:var(--lime);color:var(--teal);font:700 13px/40px var(--mono);text-align:center;letter-spacing:.04em;border-radius:2px;flex:none}
.appname{font-weight:600;font-size:16px;display:block}
.ver{font:11px var(--mono);color:rgba(255,255,255,.7);letter-spacing:.08em}
.railtitle{font:500 11px var(--mono);letter-spacing:.12em;color:rgba(255,255,255,.72);margin:0 8px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.step{display:flex;align-items:center;gap:12px;padding:8px;border-radius:4px;color:rgba(255,255,255,.75);background:none;border:0;font:inherit;font-size:14px;width:100%;text-align:left;cursor:default}
.step.can{cursor:pointer}
.step.can:hover{background:var(--teal3)}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);display:grid;place-items:center;font:600 12px var(--mono);flex:none}
.step.cur{color:var(--white);font-weight:600;background:var(--teal2)}
.step.cur .dot{background:var(--lime);border-color:var(--lime);color:var(--teal)}
.step.done .dot{border-color:var(--lime);color:var(--lime)}
.spacer{flex:1}
.lang{display:flex;flex-direction:column;gap:8px;margin:0 8px}
.lang .lbl{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.lang .btns{display:flex;gap:6px}
.lang button{font:500 12px var(--mono);letter-spacing:.06em;padding:6px 10px;border-radius:3px;border:1px solid rgba(255,255,255,.45);background:none;color:var(--white);cursor:pointer;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--lime);color:var(--teal);border-color:var(--lime)}
.railfoot{font-size:12px;color:rgba(255,255,255,.72);line-height:1.45;margin:0 8px}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--white)}
.body{flex:1;overflow:auto;padding:24px 32px;display:flex;flex-direction:column;gap:18px;min-height:0}
.head{display:flex;flex-direction:column;gap:6px}
.row3{flex-direction:row;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px 16px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:26px;font-weight:600;color:var(--teal);text-wrap:balance;letter-spacing:-.01em;line-height:1.2}
h2{margin:0;font-size:18px;font-weight:600;color:var(--teal);text-wrap:balance}
.sub{margin:0;color:var(--muted);max-width:72ch;line-height:1.5}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--lime);color:var(--teal);border-radius:4px;padding:9px 12px;font-size:13px;line-height:1.45}
.tip b{font:700 11px/1.75 var(--mono);letter-spacing:.12em;white-space:nowrap}
.foot{border-top:1px solid var(--line);padding:12px 32px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--white)}
.grow{flex:1;min-width:0;color:var(--muted);font-size:13px}
.info{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
.okline{font:500 12px var(--mono);letter-spacing:.04em;color:var(--okfg);background:var(--okbg);padding:5px 9px;border-radius:3px}

.btn{font:500 14px var(--sans);border:1px solid #B9B5AE;background:var(--white);color:var(--ink);border-radius:4px;padding:8px 16px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;min-height:40px;text-align:left}
.btn:hover{background:var(--off)}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--white);font-weight:600}
.btn.pri:hover{background:var(--teal2)}
.btn.lime{background:var(--lime);border-color:#C9E35A;color:var(--teal);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px}
.tog[aria-pressed="true"]{background:var(--teal);color:var(--white);border-color:var(--teal)}
.lnk{background:none;border:0;color:var(--teal);text-decoration:underline;text-underline-offset:2px;font:inherit;font-weight:500;cursor:pointer;padding:2px 0;text-align:left}

/* step 1 */
.detect{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px dashed var(--urban);border-radius:6px;padding:12px 14px;background:var(--off)}
.clients{display:grid;gap:6px}
.clh{display:flex;align-items:center;gap:14px}
.clh label{font-size:13px;font-weight:500;margin-right:auto}
.clist{border:1px solid #B9B5AE;border-radius:4px;background:var(--white);display:grid;max-height:112px;overflow:auto}
.crow{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 10px;font-size:13px;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid #EEEBE6;min-height:34px}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--off)}
.crow.sel{background:var(--sky);box-shadow:inset 3px 0 0 var(--teal)}
.crow .cn{font-weight:500}
.crow .cf{margin-left:auto;font:400 11px var(--mono);color:var(--muted);white-space:nowrap}
.crow:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.kept{font:400 12px var(--sans);color:var(--muted);margin-top:4px}
.suggest{font-size:13px;display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 260px}
.grid1{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.fields{display:grid;gap:12px;min-width:0}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:500}
.req{color:var(--badfg)}
input[type="text"],textarea{font:inherit;border:1px solid #B9B5AE;border-radius:4px;padding:8px 10px;background:var(--white);color:var(--ink);width:100%;box-sizing:border-box;min-height:38px}
textarea{min-height:60px;resize:vertical}
input[type="text"]:focus,textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(0,60,80,.16)}
input.filled{background:#F9FFDE;border-color:#B7CC5A}
.panel{background:var(--off);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;align-self:start}
.panel h3,.grp h3{margin:0;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px var(--mono);background:var(--white);border:1px solid var(--line);border-radius:3px;padding:3px 7px;color:var(--ink);word-break:break-all}
.chip.more{background:var(--sky);border-color:var(--sky);color:var(--teal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grp{border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.checks{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;line-height:1.4;cursor:pointer;font-size:14px}
.check input{margin:2px 0 0;accent-color:var(--teal);width:16px;height:16px;flex:none}

/* step 2 */
.drop{border:2px dashed var(--urban);border-radius:8px;background:var(--off);padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.dropt{display:flex;gap:10px;align-items:center;font-weight:500;color:var(--teal)}
.dropt svg{width:26px;height:26px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
.tbl-wrap th{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;background:var(--off);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl-wrap td{padding:9px 12px;border-bottom:1px solid #EEEBE6;vertical-align:top}
.tbl-wrap tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.fname{font-weight:500;overflow-wrap:anywhere}
.out{font:12px var(--mono);color:var(--teal);overflow-wrap:anywhere}
.type{font:500 11px var(--mono);letter-spacing:.04em;padding:2px 6px;border-radius:3px;background:var(--sky);color:var(--teal);white-space:nowrap}
.x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;width:32px;height:32px;border-radius:4px}
.x:hover{background:var(--off);color:var(--badfg)}
.empty{margin:0;padding:18px;border:1px solid var(--line);border-radius:6px;color:var(--muted);text-align:center}

/* step 3 */
.s3body{overflow:hidden}
.filebar{display:flex;gap:6px;flex-wrap:wrap}
.ftab{font:12px var(--mono);border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:3px;padding:5px 8px;cursor:pointer;display:flex;gap:8px;align-items:center;max-width:100%;min-height:34px}
.ftab .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.ftab[aria-selected="true"]{background:var(--teal);color:var(--white);border-color:var(--teal)}
.ftab[aria-selected="true"] .type{background:var(--teal3);color:var(--white)}
.ftab .n{background:var(--lime);color:var(--teal);border-radius:9px;padding:0 7px;font-weight:700}
.s3{display:grid;grid-template-columns:340px minmax(0,1fr);flex:1;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font:500 13px var(--sans);color:var(--muted);cursor:pointer;min-height:42px}
.tab[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
.flist{flex:1;overflow:auto;padding:4px 0 8px}
.gh{display:flex;justify-content:space-between;padding:12px 14px 4px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 10px;padding:6px 14px;cursor:pointer;align-items:start}
.fi:hover{background:var(--off)}
.fi input{grid-row:span 2;margin:2px 0 0;accent-color:var(--teal);width:16px;height:16px}
.fi .ft{font-weight:500;overflow-wrap:anywhere}
.fw{font-size:12px;color:var(--muted)}
.fi.off .ft{color:var(--muted);text-decoration:line-through}
.pad{padding:10px 14px 4px}
.tile{display:grid;grid-template-columns:auto 84px minmax(0,1fr);gap:10px;padding:10px 14px;align-items:center;cursor:pointer;border-bottom:1px solid #EEEBE6}
.tile:hover{background:var(--off)}
.tile input{accent-color:var(--teal);width:16px;height:16px;margin:0}
.thumb{width:84px;height:56px;border:1px solid var(--line);border-radius:3px;background:var(--white);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:76px;height:48px}
.tl{display:flex;flex-direction:column;gap:3px;min-width:0}
.tl b{font-weight:600}
.likely{align-self:flex-start;font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--lime);color:var(--teal);padding:2px 6px;border-radius:3px}
.addterm{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px;background:var(--off)}
.addterm .row{display:flex;gap:6px}
.addterm input{flex:1;min-width:0}
.viewer{display:flex;flex-direction:column;min-height:0;min-width:0}
.vbar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--off);border-bottom:1px solid var(--line);font-size:13px}
.pg{display:flex;align-items:center;gap:6px;font:12px var(--mono)}
.sqb{width:32px;height:32px;border:1px solid #B9B5AE;background:var(--white);border-radius:4px;cursor:pointer;font-size:16px;color:var(--ink)}
.sqb:disabled{opacity:.4;cursor:default}
.legend{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-left:auto}
.lg{display:inline-block;width:14px;height:10px;border-radius:2px}
.lg.on{background:var(--lime);box-shadow:0 0 0 1.5px var(--teal)}
.lg.off{box-shadow:0 0 0 1.5px var(--urban)}
.varea{flex:1;overflow:auto;background:#D6D1C9;padding:22px;display:flex;justify-content:center;align-items:flex-start}
.onote{background:var(--white);border-radius:6px;padding:24px;max-width:460px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.onote p{margin:0;line-height:1.55}
.onote .doci{display:flex;gap:12px;align-items:center;font-weight:600;color:var(--teal)}
.onote .doci svg{width:34px;height:34px}

/* the sample PDF page (a made-up client document, so it keeps its own client colours) */
.page{container-type:inline-size;width:min(100%,560px);aspect-ratio:1/1.414;background:#FFFFFF;box-shadow:0 2px 12px rgba(0,0,0,.2);position:relative;flex:none;overflow:hidden}
.pin{position:absolute;inset:0;color:#1E2A33;font-family:Arial,Helvetica,sans-serif;font-size:2.1cqw;line-height:1.45;padding:5cqw 7cqw 4cqw;box-sizing:border-box;display:flex;flex-direction:column;gap:2.6cqw}
.page.draw{cursor:crosshair;touch-action:none}
.page p{margin:0 0 1.1cqw}
.ph{display:flex;align-items:center;gap:3cqw;padding-bottom:1.4cqw;border-bottom:.35cqw solid var(--client);font-size:1.75cqw;color:var(--client)}
.ph .iw svg{width:19cqw;height:auto;display:block}
.phx{flex:1}
.phr{white-space:nowrap}
.ttl{display:flex;flex-direction:column;gap:1cqw;padding:2cqw 0 .5cqw}
.ttl .k{font-size:1.9cqw;letter-spacing:.12em;text-transform:uppercase;color:#5D6B75}
.ttl .big{font-size:4.4cqw;font-weight:700;line-height:1.15;color:#12212B}
.cov{border:.25cqw solid #C9D3DA;font-size:1.85cqw}
.cov .r{display:grid;grid-template-columns:36% 1fr;border-bottom:.2cqw solid #E1E7EB}
.cov .r:last-child{border-bottom:0}
.cov .r>span{padding:1cqw 1.6cqw}
.cov .r>span:first-child{background:#EEF3F6;font-weight:700}
.sec .h{font-weight:700;font-size:2.4cqw;margin-bottom:.8cqw;color:#12212B}
.pf{margin-top:auto;font-size:1.6cqw;color:#7A8790;display:flex;justify-content:space-between;border-top:.2cqw solid #E1E7EB;padding-top:1cqw}
.fig{display:block;width:64%;margin:0 auto}
.fig svg{display:block;width:100%;height:auto}
.cap{font-size:1.65cqw;color:#5D6B75;text-align:center;margin-top:-1.4cqw}
.sigrow{display:flex;align-items:flex-end;gap:4cqw}
.sig svg{width:22cqw;height:auto;display:block}
.sigl{font-size:1.6cqw;color:#5D6B75;border-top:.2cqw solid #9AA6AE;padding-top:.5cqw;min-width:26cqw}
.ht{width:100%;border-collapse:collapse;font-size:1.7cqw;margin-top:.6cqw}
.ht th,.ht td{border:.2cqw solid #C9D3DA;padding:.6cqw 1.1cqw;text-align:left;font-weight:400}
.ht th{background:#EEF3F6;font-weight:700}
.iw{position:relative;display:inline-block}
.ocr,.mbox{position:absolute}
.ocr{left:17%;top:79%;width:66%;height:16%}

.page [data-f]{border-radius:.4cqw;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl [data-f].mk,.hl .iw.mk{cursor:pointer}
.hl [data-f].mk.on{background:rgba(230,255,128,.85);box-shadow:0 0 0 .4cqw var(--teal)}
.hl [data-f].mk.no{box-shadow:0 0 0 .3cqw var(--urban);background:repeating-linear-gradient(135deg,transparent 0 .8cqw,rgba(156,160,156,.18) .8cqw 1.6cqw)}
.hl .iw.mk::after{content:"";position:absolute;inset:0;border-radius:.4cqw}
.hl .iw.mk.on::after{background:rgba(230,255,128,.55);box-shadow:0 0 0 .4cqw var(--teal)}
.hl .iw.mk.no::after{box-shadow:0 0 0 .3cqw var(--urban)}
.fin [data-f].mk.on{background:#000000;color:transparent;box-shadow:none;border-radius:0}
.fin [data-f].mk.on *{visibility:hidden}
.fin .iw.mk.on::after{content:"";position:absolute;inset:0;background:#000000}
.page .flash{animation:flash .9s 2}
@keyframes flash{50%{box-shadow:0 0 0 1.3cqw rgba(0,60,80,.45)}}

/* step 4 */
.sumrow{display:flex;gap:12px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:8px;padding:10px 16px;border-radius:6px;min-width:130px}
.stat b{font:600 28px var(--sans);font-variant-numeric:tabular-nums}
.stat span{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.stat.ok{background:var(--okbg);color:var(--okfg)}
.stat.bad{background:var(--badbg);color:var(--badfg)}
.stat.zero,.stat.neutral{background:var(--off);color:var(--muted)}
.stat.neutral b{color:var(--teal)}
.badge{font:700 11px var(--mono);letter-spacing:.08em;padding:4px 8px;border-radius:3px;white-space:nowrap;display:inline-block}
.badge.ok{background:var(--okbg);color:var(--okfg)}
.badge.bad{background:var(--badbg);color:var(--badfg)}
.qc{display:flex;gap:4px;flex-wrap:wrap}
.qc span{font:11px var(--mono);padding:2px 6px;border-radius:3px;background:var(--okbg);color:var(--okfg);white-space:nowrap}
.qc span.f{background:var(--badbg);color:var(--badfg)}
.problem{font:400 12px var(--sans);color:var(--badfg);margin-top:4px}
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.qcard{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.qcard b{font-weight:600;color:var(--teal)}
.qcard p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}

/* dialogs, toast */
.scrim{position:absolute;inset:34px 0 0 0;background:rgba(0,30,40,.45);display:grid;place-items:center;z-index:20;padding:16px}
.dlg{background:var(--white);border-radius:8px;width:min(500px,100%);max-height:100%;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);box-sizing:border-box}
.dlg.wide{width:min(760px,100%)}
.dlgfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.plabel{font:13px var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;min-height:2.8em}
.bar{height:8px;background:var(--sky);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .25s}
.rep-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--teal);padding-bottom:10px}
.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--teal);color:var(--white);padding:10px 14px;border-radius:4px;z-index:30;font-size:13px;width:max-content;max-width:min(520px,90%);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* launch screen */
.splash{position:absolute;inset:34px 0 0 0;background:var(--teal);color:var(--white);z-index:40;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:34px 44px;overflow:hidden;transition:opacity .5s ease}
.splash.gone{opacity:0;pointer-events:none}
.splash::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.splash>*{position:relative}
.gridline{position:absolute;left:0;right:0;top:44%;width:100%;height:34%;pointer-events:none}
.gridline path{fill:none;stroke:var(--lime);stroke-width:2;stroke-dasharray:1700;stroke-dashoffset:1700;animation:draw 2.6s ease-out forwards;vector-effect:non-scaling-stroke}
.gridline circle{fill:var(--lime);opacity:0;animation:pop .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
.sp-top,.sp-row{display:flex;justify-content:space-between;align-items:center;gap:10px 20px;flex-wrap:wrap}
.sp-top .wm{font:700 14px var(--mono);letter-spacing:.16em;color:rgba(255,255,255,.88)}
.mono{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.dim{color:rgba(255,255,255,.65)}
.sp-mid{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.sq.big{width:96px;height:96px;font-size:28px;line-height:96px}
.sp-name{font:600 64px/1 var(--sans);letter-spacing:-.02em;margin-bottom:12px}
.sp-mid .mono{color:var(--lime)}
.sp-bot{display:flex;flex-direction:column;gap:12px}
.sp-bar{height:4px;background:var(--teal3);border-radius:2px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:var(--lime);transition:width .7s ease}
.tag{font-size:15px;color:var(--lime)}
.sp-skip{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;background:none;border:1px solid rgba(255,255,255,.4);color:var(--white);border-radius:3px;padding:7px 10px;cursor:pointer;min-height:32px}
.sp-skip:hover{background:var(--teal3)}

@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  .rail{flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:12px}
  .railtitle,.railfoot,.spacer,.lang .lbl,.wc{display:none}
  .steps{flex-direction:row;order:3;flex:1 1 100%;gap:4px}
  .step{width:auto;padding:6px}
  .step .lbl{display:none}
  .step.cur .lbl{display:inline}
  .lang{margin-left:auto;margin-right:0}
  .grid1,.grid2,.s3{grid-template-columns:1fr}
  .body{padding:18px 16px;overflow:visible}
  .s3body{overflow:visible}
  .foot{padding:12px 16px}
  .side{border-right:0;border-bottom:1px solid var(--line);max-height:440px}
  .varea{padding:12px;min-height:360px}
  .cards4{grid-template-columns:1fr 1fr}
  .scrim{position:fixed;inset:0}
  .toast{position:fixed;bottom:24px}
  .splash{padding:24px 20px}
  .sp-name{font-size:44px}
  .sq.big{width:72px;height:72px;line-height:72px;font-size:22px}
  .legend{margin-left:0}
}
@media (max-width:480px){.cards4{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

  for (const n of p.clients.flatMap(c => [c.client, c.legal, ...split(c.spell)])) {
    if (!n.trim()) continue;
    const s = n.trim();
    add(s); add(s.toUpperCase());
    if (/\s/.test(s)) { add(s.replace(/\s+/g, "-")); add(s.replace(/\s+/g, "")); }
    const b = stripForm(s);
    if (b !== s) { add(b); add(b.toUpperCase()); }

  p.clients.forEach(c => split(c.abbr).forEach(add));
  split(p.extra).forEach(add);
  return out;

/* scanning */
function buildScans(keep) {
  const p = st.prof, who = p.clients.map(c => c.client + " " + c.legal + " " + c.spell).join(" ").toLowerCase();
  const abbr = p.clients.flatMap(c => split(c.abbr)).map(s => s.toUpperCase());
  const terms = [...split(p.extra), ...st.added].map(s => s.toLowerCase()).filter(s => s.length >= 3);
  const res = {};
  for (const id of st.files) {
    const old = keep && keep[id];
    const finds = [];
    for (const f of FINDS[id]) {
      let g = f.g;
      if (g === "zone" && !p[f.z]) continue;
      if (g === "pers" && !p.pers) continue;
      if (g === "meta" && !p.meta) continue;
      if (g === "client" && !who.includes(f.who)) continue;
      if (g === "extra" && !terms.some(x => f.key.includes(x) || x.includes(f.key))) continue;
      if (f.dyn && abbr.includes(f.dyn)) g = "client";
      else if (g === "abbr" && !p.abbrs) continue;
      const prev = old && old.finds.find(x => x.id === f.id);
      finds.push({...f, grp:g, on:prev ? prev.on : true});
    }
    if (old) finds.push(...old.finds.filter(x => x.g === "manual"));
    const imgs = (IMGS[id] || []).map(m => { const prev = old && old.imgs.find(x => x.id === m.id); return {...m, on:prev ? prev.on : m.on}; });
    res[id] = {finds, imgs};
  }
  return res;
}
function computeOut() {
  return st.files.map(id => {
    const f = FILE[id], sc = st.scans[id];
    // spots unticked or clicked to keep are a choice: the check allows exactly them and the report lists them
    const kept = sc.finds.filter(x => !x.on && x.g !== "meta");
    const meta = sc.finds.filter(x => !x.on && x.grp === "meta");
    const checks = [true, true, !meta.length, true];
    const ok = checks.every(Boolean);
    return {id, ok, out:ok ? anonName(f.name) : failName(f.name), n:sc.finds.filter(x => x.on).length + sc.imgs.filter(x => x.on).length, checks, probs:meta, kept};
  });
}

  <div class="foot"><button type="button" class="btn" data-act="restart">${t("newBatch")}</button><button type="button" class="btn ${fail ? "lime" : ""}" data-act="go" data-i="2">${t("backPrev")}</button><span class="grow"></span><button type="button" class="btn" data-act="folder">${t("openFolder")}</button><button type="button" class="btn pri" data-act="report">${t("openReport")}</button></div>`;

/* ---------- dialogs, toast, progress ---------- */
function modal(html, wide) {
  const d = $("#dlg");
  d.className = "dlg" + (wide ? " wide" : "");
  d.innerHTML = html;
  $("#scrim").hidden = false;
  const f = d.querySelector("button.pri, button");
  if (f) f.focus();
}
function closeModal() { $("#scrim").hidden = true; $("#dlg").innerHTML = ""; }
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(st.toastT);
  st.toastT = setTimeout(() => { el.hidden = true; }, 4200);
}
function progress(title, names, ms, done) {
  st.busy = true; renderRail();
  let i = 0, cancelled = false;
  modal(`<h2>${esc(title)}</h2><div class="plabel" id="pl"></div><div class="bar"><i id="pb"></i></div><p class="info">${t("ocrNote")}</p><div class="dlgfoot"><button type="button" class="btn" data-act="pcancel">${t("cancel")}</button></div>`);
  st.pcancel = () => { cancelled = true; };
  const step = () => {
    if (cancelled) { st.busy = false; closeModal(); renderRail(); return; }
    const pb = $("#pb"), pl = $("#pl");
    if (!pb) return;
    if (i >= names.length) { pb.style.width = "100%"; setTimeout(() => { st.busy = false; closeModal(); if (!cancelled) done(); else renderRail(); }, 280); return; }
    pl.textContent = t("progLine", {name:names[i], i:i + 1, n:names.length});
    pb.style.width = ((i + 0.5) / names.length * 100) + "%";
    i++;
    setTimeout(step, ms);
  };
  step();
}

/* ---------- actions ---------- */
function applyDetect(ids) {
  const p = st.prof, typed = Object.fromEntries(p.clients.filter(c => c.client.trim()).map(c => [c.client.trim().toLowerCase(), c]));
  const found = [];
  const nw = ids.filter(id => id !== "xls"), el = ids.filter(id => id === "xls");
  if (nw.length) found.push({client:"Nordwind Netz", legal:"Nordwind Netz GmbH", abbr:"", spell:"Nordwind-Netz", files:nw});
  if (el.length) found.push({client:"Stadtwerke Elmshagen", legal:"Stadtwerke Elmshagen AG", abbr:"", spell:"SW Elmshagen", files:el});
  for (const c of found) { const old = typed[c.client.toLowerCase()]; if (old) c.abbr = old.abbr; }
  p.clients = found; p.sel = 0;
  st.det = {n:ids.length, k:found.length, alts:ids.includes("tr") || ids.includes("doc") ? ["Kabelwerk Süd AG"] : []};
  st.sugg = ["client", "legal", "spell"];
  ids.forEach(id => { if (!st.files.includes(id)) st.files.push(id); });
  st.files.sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
  invalidate();
}
function startScan(keep) {
  progress(t("scanning"), st.files.map(id => FILE[id].name), 650, () => {
    st.scans = buildScans(keep);
    if (!st.files.includes(st.cur)) st.cur = st.files[0];
    st.out = null;
    go(2);
  });
}
function rescanWithTerm(term) {
  term = term.trim();
  if (!term) return;
  const before = Object.values(st.scans).reduce((a, s) => a + s.finds.filter(f => f.grp === "extra").length, 0);
  st.added.push(term);
  const keep = st.scans;
  progress(t("scanning"), st.files.map(id => FILE[id].name), 300, () => {
    st.scans = buildScans(keep);
    st.out = null;
    const after = Object.values(st.scans).reduce((a, s) => a + s.finds.filter(f => f.grp === "extra").length, 0);
    st.tab = 0;
    render();
    toast(after > before ? t("hits", {t:term, n:after - before}) : t("noHits", {t:term}));
  });
}

document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (!a) {
    const pg = e.target.closest("#page");
    if (pg && !st.draw && st.scans) {
      const sc = st.scans[st.cur];
      const fe = e.target.closest("[data-f].mk"), ie = e.target.closest("[data-img].mk");
      const inner = fe && ie ? (ie.contains(fe) ? fe : ie) : (fe || ie);
      if (!inner) return;
      const item = inner.dataset.f ? sc.finds.find(x => x.id === inner.dataset.f) : sc.imgs.find(x => x.id === inner.dataset.img);
      if (item) { item.on = !item.on; st.out = null; st.tab = inner.dataset.f ? 0 : 1; render(); }
    }
    return;
  }
  const act = a.dataset.act;
  if (a.disabled) return;
  switch (act) {
    case "lang":
      L = a.dataset.l;
      try { localStorage.setItem("proj05demo.lang", L); } catch (err) {}
      render();
      if (!$("#splash").hidden) $("#spstat").textContent = t($("#spstat").dataset.t || "sp1");
      break;
    case "replay": splash(); break;
    case "skip": endSplash(); break;
    case "go": if (canGo(+a.dataset.i)) go(+a.dataset.i); break;
    case "detect":
      modal(`<h2>${t("dlgPick")}</h2><div class="checks">${ORDER.map(id => `<label class="check"><input type="checkbox" data-pick="${id}" checked><span class="fname">${esc(FILE[id].name)}</span></label>`).join("")}</div><div class="dlgfoot"><button type="button" class="btn" data-act="close">${t("cancel")}</button><button type="button" class="btn pri" data-act="detectGo">${t("open")}</button></div>`);
      break;
    case "detectGo": {
      const ids = [...document.querySelectorAll("[data-pick]:checked")].map(x => x.dataset.pick);
      closeModal();
      if (!ids.length) break;
      progress(t("reading"), ids.map(id => FILE[id].name), 380, () => { applyDetect(ids); render(); const c = $("#f-client"); if (c) { c.focus(); c.select(); } });
      break;
    }
    case "alt": {
      const alt = st.det.alts[+a.dataset.i];
      st.prof.clients.push({client:stripForm(alt), legal:alt, abbr:"", spell:"", files:[]});
      st.prof.sel = st.prof.clients.length - 1;
      st.det.alts.splice(+a.dataset.i, 1);
      st.sugg = ["client", "legal"]; invalidate(); render();
      break;
    }
    case "selClient": st.prof.sel = +a.dataset.i; st.sugg = []; render(); break;
    case "addClient":
      st.prof.clients.push(blankClient()); st.prof.sel = st.prof.clients.length - 1; st.sugg = []; invalidate(); render();
      { const c = $("#f-client"); if (c) c.focus(); }
      break;
    case "rmClient":
      st.prof.clients.splice(st.prof.sel, 1);
      if (!st.prof.clients.length) st.prof.clients.push(blankClient());
      st.prof.sel = Math.min(st.prof.sel, st.prof.clients.length - 1); st.sugg = []; invalidate(); render();
      break;
    case "safelist": toast(t("safeToast")); break;
    case "clear":
      st.prof = freshProfile(); st.det = null; st.sugg = []; invalidate(); render();
      break;
    case "next0": go(1); break;
    case "addFiles": case "addFolder": {
      const add = ORDER.filter(id => !st.files.includes(id));
      if (!add.length) { toast(t("allIn")); break; }
      st.files.push(...add);
      st.files.sort((x, y) => ORDER.indexOf(x) - ORDER.indexOf(y));
      invalidate(); render();
      if (act === "addFolder") toast(t("folderAdded", {n:add.length}));
      break;
    }
    case "rm": st.files = st.files.filter(x => x !== a.dataset.id); invalidate(); render(); break;
    case "scan": startScan(null); break;
    case "file": st.cur = a.dataset.id; st.page = 1; st.draw = false; render(); { const fl = $("#flist"); if (fl) fl.scrollTop = 0; } break;
    case "tab": st.tab = +a.dataset.i; render(); break;
    case "pg": st.page = Math.min(FILE[st.cur].pages, Math.max(1, st.page + (+a.dataset.d))); render(); { const v = $(".varea"); if (v) v.scrollTop = 0; } break;
    case "draw": st.draw = !st.draw; if (st.draw) { st.fin = false; toast(t("drawHint")); } render(); break;
    case "addterm": rescanWithTerm($("#addterm").value); break;
    case "redact":
      progress(t("redacting"), st.files.map(id => anonName(FILE[id].name)), 600, () => { st.out = computeOut(); go(3); });
      break;
    case "restart": st.files = []; st.scans = null; st.out = null; st.added = []; st.det = null; st.sugg = []; st.page = 1; st.tab = 0; go(0); break;
    case "folder": toast(t("folderToast")); break;
    case "report": modal(reportHTML(), true); break;
    case "close": closeModal(); break;
    case "pcancel": if (st.pcancel) st.pcancel(); break;
  }
});

document.addEventListener("input", e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.p) return;
  if (CK.includes(el.dataset.p)) {
    cur()[el.dataset.p] = el.value;
    const row = document.querySelector(".crow.sel");
    if (row) row.innerHTML = rowHTML(cur(), st.prof.sel);
  } else st.prof[el.dataset.p] = el.value;
  el.classList.remove("filled");
  st.sugg = st.sugg.filter(k => k !== el.dataset.p);
  invalidate();
  $("#variants").innerHTML = variantsHTML();
  const nb = $("[data-act=next0]");
  if (nb) nb.disabled = !hasClient();
  renderRail();
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.o) { st.prof[el.dataset.o] = el.checked; invalidate(); renderRail(); return; }
  if (el.id === "subf") { st.subf = el.checked; return; }
  if (el.dataset.save) { st.save = el.dataset.save; return; }
  if (el.id === "fin") { st.fin = el.checked; st.draw = false; render(); return; }
  if (el.dataset.fid) {
    const f = st.scans[st.cur].finds.find(x => x.id === el.dataset.fid);
    f.on = el.checked; st.out = null;
    if (f.p && FILE[st.cur].type === "PDF" && f.p !== st.page) st.page = f.p;
    render();
    if (f.p) flash(f.id);
    return;
  }
  if (el.dataset.iid) {
    const m = st.scans[st.cur].imgs.find(x => x.id === el.dataset.iid);
    m.on = el.checked; st.out = null; render();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "addterm") { e.preventDefault(); rescanWithTerm(e.target.value); }
});

document.addEventListener("pointerdown", e => {
  const pg = e.target.closest("#page");
  if (!pg || !st.draw) return;
  e.preventDefault();
  const r = pg.getBoundingClientRect();
  const clamp = v => Math.max(0, Math.min(100, v));
  const x0 = clamp((e.clientX - r.left) / r.width * 100), y0 = clamp((e.clientY - r.top) / r.height * 100);
  const b = document.createElement("span");
  b.className = "mbox mk on";
  b.dataset.f = "drawing";
  pg.appendChild(b);
  let box = null;
  const mv = ev => {
    const x = clamp((ev.clientX - r.left) / r.width * 100), y = clamp((ev.clientY - r.top) / r.height * 100);
    box = {x:Math.min(x0, x), y:Math.min(y0, y), w:Math.abs(x - x0), h:Math.abs(y - y0)};
    Object.assign(b.style, {left:box.x + "%", top:box.y + "%", width:box.w + "%", height:box.h + "%"});
  };
  const up = () => {
    removeEventListener("pointermove", mv);
    removeEventListener("pointerup", up);
    if (!box || box.w < 1.5 || box.h < 1) { b.remove(); return; }
    st.manN++;
    st.scans[st.cur].finds.push({id:"m" + st.manN, g:"manual", grp:"manual", t:[`Rahmen ${st.manN}`, `Box ${st.manN}`], w:[`Seite ${st.page}`, `Page ${st.page}`], p:st.page, box, on:true});
    st.draw = false; st.out = null; st.tab = 0;
    render();
  };
  addEventListener("pointermove", mv);
  addEventListener("pointerup", up);
});

/* ---------- launch screen ---------- */
function splash() {
  const sp = $("#splash"), bar = $("#spbar"), txt = $("#spstat");
  clearTimeout(st.spT);
  sp.hidden = false;
  sp.classList.remove("gone");
  const path = sp.querySelector(".gridline path");
  path.style.animation = "none"; void path.getBoundingClientRect(); path.style.animation = "";
  const quick = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const keys = ["sp1", "sp2", "sp3", "sp4"];
  let i = 0;
  bar.style.width = "0";
  const next = () => {
    txt.dataset.t = keys[i];
    txt.textContent = t(keys[i]);
    bar.style.width = ((i + 1) / keys.length * 100) + "%";
    i++;
    st.spT = setTimeout(i < keys.length ? next : endSplash, quick ? 200 : (i < keys.length ? 800 : 1100));
  };
  st.spT = setTimeout(next, quick ? 0 : 250);
}
function endSplash() {
  clearTimeout(st.spT);
  const sp = $("#splash");
  sp.classList.add("gone");
  st.spT = setTimeout(() => { sp.hidden = true; }, 520);
  const b = $("#main button:not([disabled])");
  if (b) b.focus({preventScroll:true});
}

/* ---------- start ---------- */
const VIEWS = {kunde:0, client:0, dateien:1, files:1, vorschau:2, preview:2, ergebnis:3, result:3};
const h = (location.hash || "").slice(1).toLowerCase();
if (h in VIEWS) {
  const step = VIEWS[h];
  if (step >= 1) applyDetect(ORDER.slice());
  if (step >= 2) st.scans = buildScans(null);
  if (step >= 3) st.out = computeOut();
  st.step = step;
  $("#splash").hidden = true;
  render();
} else {
  render();
  splash();
}
</script>
