<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Nordmark Sales CRM, a clickable lead follow-up CRM demo for a fictional company. Portfolio demo by Harithas Harikaran.">
<link rel="stylesheet" href="../_fonts/fonts.css">
<title>Nordmark Sales CRM</title>
<style>
:root {
  color-scheme: light;
  --bg: #f3f5f7; --surface: #ffffff; --surface-2: #eef1f4; --surface-3: #e4e9ee;
  --ink: #15202b; --ink-2: #4d5b6a; --ink-3: #7c8a99; --line: #dde3ea; --line-2: #c9d2db;
  --accent: #0f5c8c; --accent-ink: #ffffff; --accent-soft: #e3eef6; --accent-hover: #0b4a72;
  --stage-lead: #86b6ef; --stage-offer: #3987e5; --stage-negotiation: #1c5cab; --stage-won: #0ca30c; --stage-lost: #d03b3b; --stage-cancelled: #898781;
  --critical: #d03b3b; --critical-soft: #fbe9e9; --warning: #b97800; --warning-soft: #fff4d6; --good: #0a7d0a; --good-soft: #e6f5e6;
  --rep-1: #2a78d6; --rep-2: #eb6834; --rep-3: #1baf7a; --rep-4: #4a3aa7; --manager: #52514e;
  --chart-1: #2a78d6; --chart-1-soft: #b7d3f6; --chart-grid: #e1e0d9; --chart-axis: #c3c2b7;
  --outlook: #0f6cbd; --outlook-soft: #e6f0fa; --sharepoint: #036c70; --sharepoint-soft: #e2f1f1;
  --shadow: 0 1px 2px rgba(21,32,43,.06), 0 6px 20px rgba(21,32,43,.07);
  --shadow-lg: 0 12px 40px rgba(21,32,43,.18);
  --radius: 6px;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f141a; --surface: #171e26; --surface-2: #1f2833; --surface-3: #27323e;
    --ink: #e8edf2; --ink-2: #aab6c2; --ink-3: #7b8896; --line: #26303b; --line-2: #34414f;
    --accent: #5aa7e6; --accent-ink: #0f141a; --accent-soft: #16304a; --accent-hover: #7ab8ec;
    --stage-lead: #9ec5f4; --stage-offer: #5598e7; --stage-negotiation: #256abf; --stage-won: #0ca30c; --stage-lost: #e66767; --stage-cancelled: #898781;
    --critical: #e66767; --critical-soft: #3a1f1f; --warning: #fab219; --warning-soft: #3a3012; --good: #22b822; --good-soft: #12301a;
    --rep-1: #3987e5; --rep-2: #d95926; --rep-3: #199e70; --rep-4: #9085e9; --manager: #c3c2b7;
    --chart-1: #3987e5; --chart-1-soft: #184f95; --chart-grid: #2c2c2a; --chart-axis: #383835;
    --outlook: #6cb4f5; --outlook-soft: #17304a; --sharepoint: #4fc3c7; --sharepoint-soft: #123637;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f141a; --surface: #171e26; --surface-2: #1f2833; --surface-3: #27323e;
  --ink: #e8edf2; --ink-2: #aab6c2; --ink-3: #7b8896; --line: #26303b; --line-2: #34414f;
  --accent: #5aa7e6; --accent-ink: #0f141a; --accent-soft: #16304a; --accent-hover: #7ab8ec;
  --stage-lead: #9ec5f4; --stage-offer: #5598e7; --stage-negotiation: #256abf; --stage-won: #0ca30c; --stage-lost: #e66767; --stage-cancelled: #898781;
  --critical: #e66767; --critical-soft: #3a1f1f; --warning: #fab219; --warning-soft: #3a3012; --good: #22b822; --good-soft: #12301a;
  --rep-1: #3987e5; --rep-2: #d95926; --rep-3: #199e70; --rep-4: #9085e9; --manager: #c3c2b7;
  --chart-1: #3987e5; --chart-1-soft: #184f95; --chart-grid: #2c2c2a; --chart-axis: #383835;
  --outlook: #6cb4f5; --outlook-soft: #17304a; --sharepoint: #4fc3c7; --sharepoint-soft: #123637;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
h1 { font-size: 22px; letter-spacing: -0.01em; }
h2 { font-size: 16px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: var(--ink); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.dim { color: var(--ink-2); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.icon { flex: none; vertical-align: -3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---- shell ---- */
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
.brand-mark { width: 32px; height: 32px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-family: var(--mono); font-size: 13px; letter-spacing: 0.02em; }
.brand-name { font-weight: 600; line-height: 1.15; }
.brand-sub { font-size: 11px; color: var(--ink-3); }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius); color: var(--ink-2); font-weight: 500; }
.nav a:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
.nav a.active { background: var(--accent-soft); color: var(--accent); }
.nav a .count { margin-left: auto; font-size: 11px; font-family: var(--mono); color: var(--ink-3); }
.sidebar-foot { margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); display: flex; flex-direction: column; gap: 8px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; height: 56px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 24px; }
.search { position: relative; flex: 1; max-width: 460px; }
.search input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface-2); }
.search .icon { position: absolute; left: 11px; top: 10px; color: var(--ink-3); }
.search-results { position: absolute; top: 40px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 6px; z-index: 30; }
.search-results .group { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 6px 8px 2px; }
.search-results a { display: flex; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 4px; color: var(--ink); }
.search-results a:hover, .search-results a.focus { background: var(--surface-2); text-decoration: none; }
.viewas { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--ink-2); }
.viewas select { padding: 6px 8px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); }
.view { padding: 24px; width: 100%; max-width: 1720px; }
.page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head .sub { color: var(--ink-3); margin-top: 3px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---- buttons, badges, avatars ---- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 500; line-height: 1.2; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-sm { padding: 4px 8px; font-size: 12.5px; }
.btn-danger { color: var(--critical); border-color: var(--critical); }
.btn-danger:hover { background: var(--critical-soft); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-outlook { color: var(--outlook); border-color: var(--outlook); background: var(--surface); }
.btn-outlook:hover { background: var(--outlook-soft); }
.btn-sharepoint { color: var(--sharepoint); border-color: var(--sharepoint); background: var(--surface); }
.btn-sharepoint:hover { background: var(--sharepoint-soft); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; line-height: 1.5; white-space: nowrap; }
.badge-stage { color: #fff; }
.badge-stage[data-stage="lead"] { background: var(--stage-lead); color: #0b2a4a; }
.badge-stage[data-stage="offer"] { background: var(--stage-offer); }
.badge-stage[data-stage="negotiation"] { background: var(--stage-negotiation); }
.badge-stage[data-stage="won"] { background: var(--stage-won); }
.badge-stage[data-stage="lost"] { background: var(--stage-lost); }
.badge-stage[data-stage="cancelled"] { background: var(--stage-cancelled); }
.badge-soft { background: var(--surface-2); color: var(--ink-2); }
.badge-outlook { background: var(--outlook-soft); color: var(--outlook); }
.badge-sharepoint { background: var(--sharepoint-soft); color: var(--sharepoint); }
.badge-warn { background: var(--warning-soft); color: var(--warning); }
.badge-crit { background: var(--critical-soft); color: var(--critical); }
.badge-good { background: var(--good-soft); color: var(--good); }
.due { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
.due[data-state="overdue"] { color: var(--critical); }
.due[data-state="today"] { color: var(--warning); }
.due[data-state="upcoming"] { color: var(--ink-2); font-weight: 500; }
.avatar { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: 10.5px; font-weight: 700; color: #fff; letter-spacing: .02em; flex: none; }
.avatar-lg { width: 40px; height: 40px; font-size: 14px; }
.avatar[data-color="rep-1"] { background: var(--rep-1); }
.avatar[data-color="rep-2"] { background: var(--rep-2); }
.avatar[data-color="rep-3"] { background: var(--rep-3); }
.avatar[data-color="rep-4"] { background: var(--rep-4); }
.avatar[data-color="manager"] { background: var(--manager); }
.avatar[data-color="contact"] { background: var(--surface-3); color: var(--ink-2); }
.user-chip { display: inline-flex; align-items: center; gap: 8px; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 3px; background: var(--surface-2); color: var(--ink-2); font-size: 11.5px; font-weight: 500; }

/* ---- layout blocks ---- */
.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.kpi .label { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
.kpi .value { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
.kpi .hint { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.card-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 14px; }
.card-head .spacer { margin-left: auto; }
.card-body { padding: 14px 16px; }
.card-body.flush { padding: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.empty { padding: 24px 16px; text-align: center; color: var(--ink-3); font-size: 13px; }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 13px; }
.dl dt { color: var(--ink-3); }
.dl dd { margin: 0; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list .grow { flex: 1; min-width: 0; }
.list .title { font-weight: 500; }
.list .meta { font-size: 12px; color: var(--ink-3); }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.section-title { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; }
.banner-sharepoint { background: var(--sharepoint-soft); border-color: transparent; color: var(--sharepoint); }
.banner-warn { background: var(--warning-soft); border-color: transparent; color: var(--warning); }
.banner-crit { background: var(--critical-soft); border-color: transparent; color: var(--critical); }

/* ---- tables ---- */
.table-wrap { overflow-x: auto; }
table.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.table th.sortable { cursor: pointer; user-select: none; }
.table th.sortable:hover { color: var(--ink); }
.table td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr.click { cursor: pointer; }
.table tr.click:hover td { background: var(--surface-2); }
.table td.r, .table th.r { text-align: right; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.filters input, .filters select { padding: 7px 10px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); }
.filters label.check { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }

/* ---- kanban ---- */
.kanban-wrap { overflow-x: auto; padding-bottom: 8px; }
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(268px, 1fr); gap: 14px; min-width: 100%; align-items: start; }
.kanban-col { background: var(--surface-2); border-radius: var(--radius); min-height: 200px; border: 1px solid var(--line); }
.kanban-col.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.kanban-head { padding: 10px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
.kanban-head .dot { width: 10px; height: 10px; border-radius: 50%; }
.kanban-head .sum { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.kanban-cards { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: grab; box-shadow: 0 1px 2px rgba(21,32,43,.05); }
.kcard:hover { border-color: var(--line-2); }
.kcard.dragging { opacity: .5; }
.kcard .t { font-weight: 500; margin-bottom: 2px; }
.kcard .c { font-size: 12px; color: var(--ink-2); }
.kcard .foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; }
.kcard .foot .v { font-family: var(--mono); font-weight: 500; }
.kcard .foot .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.kcard .move { position: relative; }
.menu { position: absolute; right: 0; top: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 4px; z-index: 15; min-width: 160px; }
.menu button { display: block; width: 100%; text-align: left; padding: 7px 10px; border: 0; background: transparent; border-radius: 4px; cursor: pointer; }
.menu button:hover { background: var(--surface-2); }

/* ---- lead detail ---- */
.lead-head { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; }
.lead-head .top { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.lead-head .facts { display: flex; gap: 26px; flex-wrap: wrap; margin-top: 14px; }
.fact .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.fact .v { font-weight: 500; margin-top: 2px; }
.stepper { display: flex; align-items: center; gap: 0; margin-top: 16px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-3); font-size: 12.5px; font-weight: 500; }
.step:first-child { border-radius: 6px 0 0 6px; }
.step .n { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-2); font-size: 10.5px; font-family: var(--mono); }
.step.done { color: var(--ink-2); }
.step.done .n { background: var(--stage-negotiation); color: #fff; }
.step.current { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.step.current .n { background: var(--accent); color: var(--accent-ink); }
.step.closed { border-radius: 0 6px 6px 0; }
.step.closed.current[data-stage="won"] { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.step.closed.current[data-stage="won"] .n { background: var(--good); color: #fff; }
.step.closed.current[data-stage="lost"], .step.closed.current[data-stage="cancelled"] { background: var(--critical-soft); color: var(--critical); border-color: var(--critical); }
.step.closed.current[data-stage="lost"] .n, .step.closed.current[data-stage="cancelled"] .n { background: var(--critical); color: #fff; }
.step-branch { display: flex; gap: 4px; margin-left: 6px; }
.step-branch .step { border-radius: 4px; padding: 4px 10px; }
.lead-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.contact-card .name { font-weight: 600; font-size: 15px; }
.contact-card .lines { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); }
.contact-card .lines span { display: flex; align-items: center; gap: 8px; }
.history { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.history .h-item { display: grid; grid-template-columns: 8px 1fr; gap: 10px; padding: 6px 0; font-size: 12.5px; }
.history .h-item .bullet { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); margin-top: 5px; }
.history .h-item.current .bullet { background: var(--accent); }
.history .h-item .who { font-weight: 500; }
.history .h-item .when { color: var(--ink-3); }
.next-action .type { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.next-action .note { margin-top: 6px; color: var(--ink-2); }
.next-action .foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

/* ---- timeline ---- */
.composer { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); border-radius: var(--radius) var(--radius) 0 0; }
.composer textarea { width: 100%; min-height: 64px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); resize: vertical; }
.composer .foot { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.composer select { padding: 5px 8px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); font-size: 12.5px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 12px; cursor: pointer; color: var(--ink-2); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.timeline { padding: 6px 16px 12px; }
.tl-day { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 14px 0 6px; font-weight: 600; }
.tl-item { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.tl-item:first-of-type { border-top: 0; }

const CLOSED_STAGE_IDS = STAGES.filter((s) => !s.open).map((s) => s.id);

// ===================== format helpers =====================
const GROUP0 = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const GROUP2 = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MS_PER_DAY = 86_400_000;
function pad2(n) { return String(n).padStart(2, '0'); }
function padNumber(n, width = 4) { return String(n).padStart(width, '0'); }
function formatEUR(value, { decimals = 0 } = {}) { return '€ ' + (decimals === 2 ? GROUP2 : GROUP0).format(Number(value) || 0); }
function trimmedNumber(n, maxDecimals) { return new Intl.NumberFormat('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: maxDecimals }).format(n); }
function formatEURCompact(value) {
  const n = Number(value) || 0; const abs = Math.abs(n);
  if (abs >= 1_000_000) return '€ ' + trimmedNumber(n / 1_000_000, 2) + ' M';
  if (abs >= 1_000) return '€ ' + trimmedNumber(n / 1_000, 1) + ' k';
  return formatEUR(n);
}
function toDate(value) {
  if (value instanceof Date) return new Date(value.getTime());
  if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)) { const [y, m, d] = value.split('-').map(Number); return new Date(y, m - 1, d); }
  return new Date(value);
}
function toDateKey(value) { const d = toDate(value); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function addDays(value, days) { const d = toDate(value); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + days, d.getHours(), d.getMinutes(), d.getSeconds(), d.getMilliseconds()); }
function daysBetween(from, to) { return Math.round((toDate(toDateKey(to)) - toDate(toDateKey(from))) / MS_PER_DAY); }
function formatDate(value) { if (!value) return ''; const d = toDate(value); return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`; }
function formatTime(value) { if (!value) return ''; const d = toDate(value); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function formatDateTime(value) { return value ? `${formatDate(value)} ${formatTime(value)}` : ''; }
function formatMonth(value) { return toDate(value).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }); }
function formatDayLabel(value, now) {
  const days = daysBetween(value, now);
  if (days === 0) return 'Today'; if (days === 1) return 'Yesterday';
  return toDate(value).toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
}
function relativeDue(dueKey, todayKey) {
  const diff = daysBetween(todayKey, dueKey);
  if (diff === 0) return { label: 'Today', state: 'today' };
  if (diff === 1) return { label: 'Tomorrow', state: 'upcoming' };
  if (diff === -1) return { label: '1 day overdue', state: 'overdue' };
  if (diff < 0) return { label: `${-diff} days overdue`, state: 'overdue' };
  return { label: `In ${diff} days`, state: 'upcoming' };
}
function formatRelative(iso, now) {
  const then = toDate(iso); const ref = toDate(now);
  const mins = Math.round((ref - then) / 60_000);
  if (mins < 1) return 'just now'; if (mins < 60) return `${mins} min ago`;
  const hours = Math.round(mins / 60); if (hours < 24) return `${hours} h ago`;
  const days = daysBetween(then, ref); if (days === 1) return 'yesterday'; if (days < 30) return `${days} days ago`;
  return formatDate(then);
}
function initialsOf(name) { return String(name || '').split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join(''); }
function fileExt(name) { return String(name).split('.').pop().toLowerCase(); }
function formatSize(bytes) { return bytes >= 1_000_000 ? `${trimmedNumber(bytes / 1_000_000, 1)} MB` : `${Math.round(bytes / 1000)} KB`; }
