<!doctype html>
<!--
  Nordstern CRM — rev49  (2026-10-14)
  ======================================================================
  A single-file prototype of the CRM as it runs in production (version v02): same code, same colours,
  German with the EN/DE switch, phone and tablet layout, the rev42–rev48 changes, the column filters with
  letter row and "starts with" search, sortable headers, further contacts on a lead.

  How it works
  - Open the file in a browser. No server, no SharePoint, nothing leaves the computer.
  - Changes are kept in the browser (localStorage key "nscrm.rev49"), so they survive a reload.
    Back to the sample data: open the browser console and run  resetSampleData()  — or clear the site data.
  - Files attached in the prototype live in memory only; links, records and everything else persist.
  - "Backup exportieren" in the footer writes the whole data set as JSON, "Importieren" reads it again.

  How to change it
  - The whole application is the <script> below: plain JavaScript, no build step, no framework.
    It is grouped by module (dom, format, vocab, store, the views, i18n) in the same order as the source.
  - Texts: English in the views; the German dictionary is the object DE near "i18n-de" (English key -> German).
  - Colours: the CSS block "corporate palette" inside APP_CSS.
  - Vocabularies (stages, lead types, project types, ...): the arrays near "vocabularies".
  Edit, save, reload. Send the changed file back, or describe the change and name the place in the file.
-->

  --shadow:0 1px 2px rgba(0,0,0,.35);
  --shadow-hover:0 2px 6px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
  --shadow-lg:0 24px 60px rgba(0,0,0,.6);
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.nscrm{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh}
svg{display:block} a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25;text-wrap:balance}
h1{font-size:24px;letter-spacing:-.012em;font-weight:650}
h2{font-size:17px;letter-spacing:-.005em}
h3{font-size:15px}
p{margin:0;text-wrap:pretty}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono,.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)}
.sm{font-size:13.5px} .xs{font-size:12.5px}
.up{text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.gap12{gap:12px} .gap16{gap:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.linkish{color:var(--accent);font-weight:500}
.linkish:hover{text-decoration:underline;text-underline-offset:2px}

/* ---------- shell ---------- */
/* The frame: a fixed menu column on the left, search and actions on top of the content. */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:18px 14px;
      background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;z-index:30}
.side .logo{padding:2px 6px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;min-height:60px;padding:0 24px;
     background:var(--surface);border-bottom:1px solid var(--line)}
.top .search{flex:1;width:auto;max-width:420px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;flex:none}
.logo .mark{color:var(--logo);display:block;flex:none}
.logo .brand{padding-left:9px;border-left:1px solid var(--line-2)}
/* Filter dropdowns on the leads list: the chosen one is outlined like an active chip. */
.inp.fsel{width:auto;min-width:230px;min-height:34px;height:34px;padding-top:0;padding-bottom:0;font-size:14px}
.fsel.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
/* "a Nordstern Solution": small, widely tracked caps with the name a step darker. */
.sol{display:inline-block;font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.sol b{font-weight:700;color:var(--logo);letter-spacing:.18em}
.printonly{display:none}
/* ---------- Reports: charts of the activity in History ---------- */
.pad.tight{padding:14px 20px 16px}
.card .head+.pad.tight{padding-top:4px}
.act-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:22px;align-items:start}
.act-side{display:flex;flex-direction:column;gap:10px;padding-top:2px}
.act-side .hb{grid-template-columns:78px 1fr 30px;gap:8px}
.act-side .hb-l{font-size:13px}
.rep-range{gap:8px;align-items:center;padding:10px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm)}
.rep-range .inp{width:auto;min-height:34px;height:34px;padding:0 10px;font-size:13.5px}
@media (max-width:1000px){ .act-grid{grid-template-columns:1fr} }
.rep-n{font-size:30px;font-weight:650;line-height:1.15;letter-spacing:-.01em;color:var(--ink)}
.rep-d{font-weight:600;color:var(--ink-3)} .rep-d.good{color:var(--good)} .rep-d.crit{color:var(--crit)}
.chart{position:relative}
.chart-svg{display:block;width:100%;height:auto;overflow:visible}
.chart-svg .grid{stroke:var(--line);stroke-width:1}
.chart-svg .axis{stroke:var(--line-2);stroke-width:1}
.chart-svg .tick{fill:var(--ink-3);font-size:11px;font-family:inherit;font-variant-numeric:tabular-nums}
.chart-svg .hit{fill:transparent;cursor:default;outline:none}
.chart-svg .hit:hover,.chart-svg .hit:focus{fill:var(--ink);fill-opacity:.04}
.chart-svg.cal{width:auto;max-width:100%}
.hc{stroke:var(--surface);stroke-width:1;outline:none} .hc:hover,.hc:focus{stroke:var(--ink);stroke-width:1.5}
.h0{fill:var(--surface-3);background:var(--surface-3)} .h1{fill:var(--h1);background:var(--h1)} .h2{fill:var(--h2);background:var(--h2)}
.h3{fill:var(--h3);background:var(--h3)} .h4{fill:var(--h4);background:var(--h4)}
.hc-k{display:inline-block;width:11px;height:11px;border-radius:3px}
.seg-toggle{display:flex;gap:4px}
.filt.filt-sm{min-height:30px;padding:0 12px;font-size:13px}
.clegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.clegend-k{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.ctip{position:absolute;z-index:5;pointer-events:none;min-width:160px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);
      box-shadow:0 6px 20px rgba(16,24,40,.12);padding:8px 10px;font-size:13px}
.ctip-h{font-size:12px;color:var(--ink-3);margin-bottom:4px}
.ctip-r{display:flex;align-items:center;gap:8px;line-height:1.6}
.ctip-r b{min-width:22px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.ctip-r span:last-child{color:var(--ink-2)}
.ctip-k{width:12px;height:3px;border-radius:2px;flex:none}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,170px) 1fr 70px;align-items:center;gap:12px;color:var(--ink);border-radius:6px}
a.hb:hover .hb-l{color:var(--accent)}
.hb-l{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.hb-t{height:12px}
.hb-b{display:block;height:100%;min-width:2px;border-radius:0 4px 4px 0}
.hb-v{text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.rep-more summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.rep-more summary::-webkit-details-marker{display:none}
.rep-more summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-right:6px}
.rep-more[open] summary::after{transform:rotate(-135deg)}
.rep-more[open] summary{border-bottom:1px solid var(--line)}
.res-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 18px;padding:14px 16px;background:var(--surface-2);border-radius:var(--r-sm)}
.res-sum-n{font-size:18px;font-weight:650}
.lead-figs{display:grid;grid-template-columns:repeat(5,1fr)}
.lead-fig{display:flex;flex-direction:column;gap:4px;padding:0 18px;border-left:1px solid var(--line);min-width:0}
.lead-fig:first-child{padding-left:0;border-left:0}
.lead-fig .rep-n{font-size:26px}
@media (max-width:900px){ .lead-figs{grid-template-columns:1fr 1fr;row-gap:18px} .lead-fig{padding:0;border-left:0} }
@media (max-width:560px){ .hb{grid-template-columns:110px 1fr 56px} }
/* ---------- Strategy: long-term goals and quarterly OKRs ---------- */
/* The guide folds away at the foot of the quarter; open, it lays its blocks out side by side. */
.okr-guide-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px 24px;align-items:start}
.okr-guide summary .up{color:var(--ink)}
/* The one-year goal above the objectives: the reason the quarter exists. */
.focus{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:12px 18px;border-left:3px solid var(--accent)}
.focus p{margin:0;min-width:220px}
.dir-objs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dir-obj{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:11px 0;border-top:1px solid var(--line)}
.dir-obj:first-child{border-top:0}
.dir-obj .up{flex:none;width:96px}
.okr-goals{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
/* SWOT: four quadrants, each marked by the colour of its side. */
.swot{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.swot-box{display:flex;flex-direction:column;gap:7px;padding:12px 14px;background:var(--surface-2);
          border:1px solid var(--line);border-left:3px solid var(--sw-c);border-radius:var(--r-sm)}
.swot-box .up{color:var(--sw-c)}
.sw-s{--sw-c:var(--good)} .sw-w{--sw-c:var(--crit)} .sw-o{--sw-c:var(--accent)} .sw-t{--sw-c:var(--warn)}
.swot-l{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--ink-2)}
.swot-l li::marker{color:var(--sw-c)}
.dlg-swot .grid2{gap:14px 18px}
.okr-by{color:var(--ink-3);font-weight:500}
.okr-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px}
.inp.okr-sel{width:auto;min-height:34px;height:34px;padding:0 30px 0 10px}
.obj{overflow:hidden}
.obj-h{display:flex;align-items:flex-start;gap:20px;padding:18px 20px 16px}
.obj-t{font-size:17px;font-weight:600;line-height:1.4;letter-spacing:-.005em}
/* Scores - quarter, objective, key result - share one look: the number in the traffic-light colour, its status, a thin bar. */
.sc{display:flex;flex-direction:column;gap:5px;flex:none}
.sc-top{display:flex;align-items:baseline;gap:8px}
.sc-n{font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink-3);line-height:1.15}
.sc-n.good{color:var(--good)} .sc-n.warn{color:var(--warn)} .sc-n.crit{color:var(--crit)}
.sc-n.lg{font-size:24px} .sc-n.md{font-size:18px} .sc-n.sm{font-size:15px}
.sc-l{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.sc-bar{height:4px;margin-top:0}
.sc.lg{width:150px;padding-top:2px} .sc.md{width:130px} .sc.sm{width:100%}
.okr-qs{display:flex}
/* Key results fold away behind a one-line summary; open, they read like a table elsewhere in the CRM. */
.krs-toggle{display:flex;align-items:center;gap:8px;width:100%;padding:11px 20px;background:none;border:0;border-top:1px solid var(--line);color:var(--ink-2);text-align:left;cursor:pointer}
.krs-toggle svg{transition:transform .15s;transform:rotate(-90deg);flex:none;color:var(--ink-3)}
.krs-toggle.open svg{transform:none}
.krs-toggle:hover{background:var(--surface-2)}
.krt[hidden]{display:none}
.krt-row{display:grid;grid-template-columns:minmax(0,1fr) 58px 58px 76px 56px 96px;gap:12px;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}
.krt-row.click{cursor:pointer}
.krt-row.click:hover{background:var(--surface-2)}
.krt-head{padding-top:9px;padding-bottom:9px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
.krt-row .num{text-align:right;font-variant-numeric:tabular-nums}
.krt-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.krt-t{font-size:14.5px;line-height:1.45}
.krt-ev{font-size:12.5px;color:var(--ink-3)}
.inp.krt-cur{min-height:32px;height:32px;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums;font-size:14.5px}
.krt-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px 14px;border-top:1px solid var(--line)}
/* Key result dialog: the four numbers share one row. */
.dlg-q4 .grid2{grid-template-columns:repeat(4,1fr)}
@media (max-width:760px){
  .obj-h{flex-wrap:wrap} .obj-h .sc{order:3;width:100%}
  .krt-head{display:none}
  .krt-row{grid-template-columns:repeat(4,1fr);row-gap:10px}
  .krt-text,.krt-row > .krt-c:nth-child(6){grid-column:1/-1}
  .krt-c[data-l]::before{content:attr(data-l);display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;margin-bottom:3px;text-align:left}
  .dlg-q4 .grid2{grid-template-columns:1fr 1fr}
}
.okr-l{font-size:12px;font-weight:600;color:var(--ink-3)}
.okr-hint{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 6px 6px 0;color:var(--ink)}
.fbox{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.fbox code{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);padding:5px 8px;border-radius:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
@media (max-width:700px){ .okr-goals{grid-template-columns:1fr} .swot{grid-template-columns:1fr} }
/* The lockup: mark, hairline, "CRM" over the claim \u2014 nothing else. */
.logo .brand{display:flex;flex-direction:column;line-height:1.05;gap:4px}
.logo .crm{font-size:16px;font-weight:700}
.logo .sol{font-size:8.5px;letter-spacing:.16em}
/* Build tokens under the lockup, set off by a hairline, in the mono face used for anything technical. */
.side-meta{display:flex;gap:6px;margin-top:-12px;padding:9px 8px 0;border-top:1px solid var(--line);
           font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.side-meta .dot{color:var(--line-2)}
.side-meta .demo{color:var(--warn)}
/* The menu: one row per screen, the current one filled in the accent colour. */
.nav{display:flex;flex-direction:column;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);font-size:14.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.nav a svg{color:var(--ink-3);flex:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a.on svg{color:var(--accent)}
@media (max-width:1200px){ .top .lbl{display:none} }
.wip{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:1px 5px;border-radius:4px}
.page{width:100%;max-width:1180px;margin:0 auto;padding:28px 24px 72px;display:flex;flex-direction:column;gap:20px}
.subnav{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;width:fit-content}
.subnav button{border:0;background:transparent;padding:7px 16px;border-radius:7px;font-size:14px;font-weight:500;color:var(--ink-2)}
.subnav button:hover{color:var(--ink)}
.subnav button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.08)}
/* Filter rows: a fixed label column so chips on every row start on the same line. */
/* Filter rows belong together: closer to each other than to the list they filter. */
.filters{display:flex;flex-direction:column;gap:10px}
.flabel{flex:none;width:72px;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.statb{border:0;background:transparent;padding:4px 8px;margin:-4px -8px;border-radius:8px;font:inherit;color:inherit;cursor:pointer}
.statb:hover{background:var(--surface-2)}

/* ---------- search + menus ---------- */
.search{position:relative;width:200px;flex:none}
.search>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;min-height:38px;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);font-size:14px}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.results{position:absolute;top:calc(100% + 8px);left:0;width:360px;background:var(--surface);border:1px solid var(--line);
         border-radius:var(--r);box-shadow:var(--shadow-lg);max-height:400px;overflow:auto;padding:6px;z-index:40}
.results a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--r-sm);font-size:14.5px}
.results a:hover{background:var(--surface-2)}
.results .g{padding:10px 10px 4px}
.pop{position:absolute;top:calc(100% + 8px);right:0;min-width:240px;background:var(--surface);border:1px solid var(--line);
     border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;z-index:45}
.pop button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border:0;background:transparent;
            border-radius:var(--r-sm);font-size:14.5px;text-align:left;color:var(--ink)}
.pop button:hover{background:var(--surface-2)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 8px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border:1px solid var(--line-2);background:var(--surface);
     border-radius:var(--r-sm);font-size:14px;font-weight:600;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-2)} .btn:disabled{opacity:.5;cursor:not-allowed}
.b-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b-pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.b-dgr{background:var(--crit);border-color:var(--crit);color:#fff}
.b-gho{background:transparent;border-color:transparent;color:var(--ink-2)}
.b-gho:hover{background:var(--surface-2);color:var(--ink)}
.b-sm{min-height:32px;padding:0 10px;font-size:13.5px;border-radius:7px}
.b-ico{min-height:34px;width:34px;padding:0;border-radius:var(--r-sm)}
/* Inline edit/delete links under history entries stay text-sized. */
.ebody .row .b-sm{min-height:0;padding:0 4px;font-size:12.5px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 0;min-height:52px}
.head + .pad{padding-top:12px}
.split{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:20px;align-items:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.bar{display:flex;gap:24px;flex-wrap:wrap;align-items:baseline}
.bar b{font-variant-numeric:tabular-nums;font-size:22px;font-weight:650;letter-spacing:-.01em}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:14.5px}

/* ---------- chips and filters ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:12.5px;font-weight:600;line-height:1.5;
      background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
/* Descriptive tags (lead, event and category types) are quiet outlines - colour stays reserved for state. */
.chip.vio,.chip.teal{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2);font-weight:500}
a.chip:hover{background:var(--surface-3)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.filt{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;
      font-size:14px;font-weight:500;background:var(--surface);color:var(--ink-2)}
.filt:hover{border-color:var(--ink-3);color:var(--ink)}
.filt.on{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.filt .n{font-variant-numeric:tabular-nums;font-size:12.5px;opacity:.7}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none;
    background:var(--surface-3);color:var(--ink-2)}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;
   padding:14px 16px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover{background:var(--surface-2)}
.tnum{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- lead cards ---------- */
.leads{display:flex;flex-direction:column;gap:12px}
.lead{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);transition:border-color .12s, box-shadow .12s}
.lead:hover{border-color:var(--line-2);box-shadow:var(--shadow-hover)}
.lead h3{font-size:17px;font-weight:600;letter-spacing:-.005em}
.next{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14.5px}

/* ---------- forms ---------- */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label{font-size:13.5px;font-weight:600;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.f .err{font-size:13px;color:var(--crit);font-weight:600}
.f .hint{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.inp{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:15px}
.inp::placeholder,.comp textarea::placeholder{color:var(--ink-3)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp:disabled{background:var(--surface-2);color:var(--ink-2)}
.inp.bad{border-color:var(--crit)}
textarea.inp{resize:vertical;min-height:84px;font-family:inherit;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2 .full{grid-column:1/-1}
.found{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--good);
       background:var(--good-soft);padding:1px 6px;border-radius:4px}
.sec{border-top:1px solid var(--line);padding-top:16px;margin-top:4px;grid-column:1/-1}

/* ---------- composer and files ---------- */
.comp{border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);overflow:hidden}
.comp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.comp textarea{width:100%;border:0;padding:14px 16px;background:transparent;resize:vertical;min-height:80px;font-family:inherit;font-size:15px;line-height:1.55}
.comp textarea:focus{outline:none}
.comp .cf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.drop{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--accent) 14%,transparent);
      border:3px dashed var(--accent);display:grid;place-items:center;font-weight:600;color:var(--accent);font-size:18px}
.file{display:flex;align-items:flex-start;gap:12px;padding:10px 0}
.fic{width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2);
     font-size:10.5px;font-weight:700}
.thumb{width:100%;max-width:260px;border-radius:var(--r-sm);border:1px solid var(--line);margin-top:8px}

/* ---------- history stream ---------- */
.stream{display:flex;flex-direction:column}
.ent{display:grid;grid-template-columns:30px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.ent:first-child{padding-top:4px}
.ent:last-child{border-bottom:0;padding-bottom:0}
.eic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.eic.g{background:var(--good-soft);color:var(--good)} .eic.c{background:var(--crit-soft);color:var(--crit)}
.eic.b{background:var(--accent-soft);color:var(--accent)} .eic.v{background:var(--violet-soft);color:var(--violet)}
.ebody{min-width:0;display:flex;flex-direction:column;gap:5px}
.etxt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.6;max-width:75ch}

/* ---------- stages ---------- */
.stages{display:flex;gap:8px;flex-wrap:wrap}
.stg{flex:1;min-width:92px;min-height:40px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 12px;background:var(--surface);
     font-size:14px;font-weight:600;color:var(--ink-2);text-align:center}
.stg:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.stg.on{color:#fff;border-color:transparent}
.stg.on.s-new{background:var(--new)} .stg.on.s-offer{background:var(--offer)}
.stg.on.s-won{background:var(--won)} .stg.on.s-lost{background:var(--lost)}

/* ---------- KPI tiles ---------- */
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;background:var(--surface);box-shadow:var(--shadow)}
.kpi .kv2{display:flex;align-items:baseline;gap:8px;margin:8px 0 4px}
.kpi .kn{font-variant-numeric:tabular-nums;font-size:28px;font-weight:650;letter-spacing:-.015em;line-height:1.1}
.kpib{cursor:pointer;transition:border-color .12s, box-shadow .12s}
.kpib:hover{border-color:var(--line-2);box-shadow:var(--shadow-hover)}
.track{height:6px;background:var(--surface-3);border-radius:100px;overflow:hidden;margin-top:12px}
.fillb{height:100%;border-radius:100px;background:var(--accent)}
.fillb.ok{background:var(--good)} .fillb.mid{background:var(--amber)} .fillb.low{background:var(--crit)}
.spark{display:flex;align-items:flex-end;gap:4px;height:36px;margin-top:12px}
.spark div{flex:1;background:var(--surface-3);border-radius:3px 3px 0 0;min-height:2px}
.spark div.has{background:var(--accent)}

/* ---------- notes, key-value lists, toasts ---------- */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);font-size:14px;line-height:1.5}
.note svg{flex:none;margin-top:2px}
.n-crit{background:var(--crit-soft);color:var(--crit)} .n-info{background:var(--accent-soft);color:var(--accent)}
.n-good{background:var(--good-soft);color:var(--good)} .n-warn{background:var(--warn-soft);color:var(--warn)}
.kvl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14.5px;align-items:baseline;margin:0}
.kvl dt{color:var(--ink-3);font-size:13.5px;white-space:nowrap}
.kvl dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.toasts{position:fixed;right:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
       border-radius:var(--r-sm);padding:12px 16px;box-shadow:var(--shadow-lg);font-size:14.5px;max-width:400px;animation:in .18s ease}
.toast.ok{border-left-color:var(--good)} .toast.no{border-left-color:var(--crit)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- task rows: tick | title | priority + due | actions; notes under the title ---------- */
.tsk{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;column-gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tsk:first-child{padding-top:2px}
.tsk:last-child{border-bottom:0}
.tsk input{width:18px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer}
.tsk .ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.tsk .tt{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.tsk .tmeta{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:120px}
.tsk .tacts{display:flex;opacity:.5;transition:opacity .12s}
.tsk .tacts .b-ico{min-height:30px;width:30px}
.tsk:hover .tacts,.tsk:focus-within .tacts{opacity:1}
.tsk .tnotes{grid-column:2 / 4;margin:3px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink-3);white-space:pre-wrap;overflow-wrap:anywhere;max-width:80ch;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;border-radius:4px}
.tsk .tnotes:hover{color:var(--ink-2)}
.tsk .tnotes.open{display:block;-webkit-line-clamp:unset;overflow:visible}
.tsk.done .tt{text-decoration:line-through;color:var(--ink-3)}
@media (hover:none){ .tsk .tacts{opacity:1} }
.prev{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.prev td,.prev th{padding:7px 10px;font-size:13px;white-space:nowrap}

/* ---------- linked-to rows ---------- */
.lgroup{display:flex;flex-direction:column;gap:2px}
.lgroup+.lgroup{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.lgroup>.up{margin-bottom:6px}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 8px;margin:0 -8px;border-radius:var(--r-sm);min-width:0}
a.lrow:hover,.lrow-act:hover{background:var(--surface-2)}
.lic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.lrow:hover .lic{background:var(--surface-3)}

/* ---------- dialog ---------- */
dialog{border:0;padding:0;background:transparent;max-width:min(760px,94vw);width:100%}
dialog::backdrop{background:rgba(15,20,26,.5)}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);
     display:flex;flex-direction:column;max-height:90vh;overflow:hidden}
.dlg-h{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dlg-h h2{font-size:19px}
.dlg-b{padding:20px 24px 24px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.dlg-f{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--surface-2)}

/* ---------- motion, small screens, print ---------- */
@media (prefers-reduced-motion: reduce){
  .kpib,.lead,.tsk .tacts{transition:none} .toast{animation:none}
}
@media (max-width:900px){
  .split,.two,.three{grid-template-columns:1fr} .grid2{grid-template-columns:1fr}
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;flex-basis:100%;gap:2px}
  .side-meta{display:none}
  .nav a{padding:6px 10px}
  .top{padding:10px 16px;flex-wrap:wrap;gap:10px} .page{padding:20px 16px 56px}
  .top .search{max-width:none;flex-basis:100%;order:9} .kbd{display:none}
  .topacts{margin-left:auto}
  .lead>.rowb{flex-direction:column;align-items:flex-start;gap:8px}
  .rowb{row-gap:10px}
  .tsk{grid-template-columns:18px minmax(0,1fr) auto}
  .tsk .tacts{grid-column:3;grid-row:1;opacity:1}
  .tsk .tmeta{grid-column:2;grid-row:2;justify-content:flex-start;min-width:0;margin-top:6px}
  .tsk .tnotes{grid-column:2 / 4}
}
@media print{
  .top,.side,.comp,.filt,.subnav,.noprint,.drop,.toasts{display:none!important}
  .shell{display:block}
  .nscrm{background:#fff} .page{max-width:none;padding:0}
  .card{box-shadow:none;break-inside:avoid} .split,.two,.three{grid-template-columns:1fr}
  a[href^="#"]::after{content:""}
  .printonly{display:block;margin-top:18px;font-size:11px;color:#53575a}
}

/* ---------- top layer ----------
   SharePoint's content zone carries a CSS transform, which turns position:fixed
   into "fixed inside the web part". The Popover API puts toasts and the drop
   overlay into the browser's top layer, like <dialog>.showModal() already does. */
[popover]{border:0;padding:0;margin:0;background:transparent;overflow:visible;color:inherit;inset:auto;width:auto;height:auto}
.toasts{pointer-events:none} .toast{pointer-events:auto}
.toasts[popover]{position:fixed;right:20px;bottom:20px;left:auto;top:auto}
.drop[popover]{position:fixed;inset:0;margin:0;background:color-mix(in srgb,var(--accent) 14%,transparent);border:3px dashed var(--accent);display:grid;place-items:center;font-weight:600;color:var(--accent);font-size:18px}
dialog{margin:auto}
/* The mock gives .drop and .toasts a display value, which would beat the browser's hidden-popover default. */
.drop[popover]:not(:popover-open),.toasts[popover]:not(:popover-open){display:none}

/* ===== corporate palette (decision 22.09.2026): Slate Teal #003C50, Electric Yellow-Green #E6FF80,
   Sand Beige #E6E2DC, Off-White #F6F6F6, Sky Blue #D0E6EA, Sandstone Beige #DED0BE, Urban Grey #9CA09C,
   Dark Grey #262C30; tints and shades allowed. Later rules win over the rev41 defaults above. ===== */
:host{
  --bg:#F6F6F6; --surface:#FFFFFF; --surface-2:#EFECE7; --surface-3:#E6E2DC;
  --ink:#262C30; --ink-2:#3E4649; --ink-3:#6B716E; --line:#E6E2DC; --line-2:#DED0BE;
  --accent:#003C50; --accent-ink:#FFFFFF; --accent-soft:#D0E6EA; --accent-hover:#002B3A; --logo:#003C50;
  --c1:#003C50; --c2:#B9D23E; --c3:#7FB3C0; --c4:#C4AE8A; --c5:#9CA09C; --c6:#262C30;
  --o1:#D0E6EA; --o2:#6F9FB0; --o3:#003C50; --h1:#E6E2DC; --h2:#D0E6EA; --h3:#6F9FB0; --h4:#003C50;
  --new:#9CA09C; --offer:#003C50;
  --teal:#003C50; --teal-soft:#D0E6EA; --violet:#4E5F66; --violet-soft:#E6E2DC; --amber:#7A6A1F;
  --shadow:0 1px 2px rgba(38,44,48,.05); --shadow-hover:0 2px 6px rgba(38,44,48,.07), 0 8px 24px rgba(38,44,48,.07);
}
@media (prefers-color-scheme: dark){ :host(:not([data-theme="light"])){
  --bg:#1E2327; --surface:#262C30; --surface-2:#2F363B; --surface-3:#3A4247;
  --ink:#F6F6F6; --ink-2:#D8DBD9; --ink-3:#9CA09C; --line:#3A4247; --line-2:#4A5358;
  --accent:#E6FF80; --accent-ink:#262C30; --accent-soft:#2E3A2B; --accent-hover:#F2FFB0; --logo:#E6FF80;
  --c1:#7FB3C0; --c2:#E6FF80; --c3:#D0E6EA; --c4:#DED0BE; --c5:#9CA09C; --c6:#F6F6F6;
  --o1:#2C4A57; --o2:#6F9FB0; --o3:#D0E6EA; --h1:#2C4A57; --h2:#3F6B7A; --h3:#6F9FB0; --h4:#D0E6EA;
  --new:#9CA09C; --offer:#7FB3C0; --teal:#7FB3C0; --teal-soft:#2C4A57; --violet:#C9CFCB; --violet-soft:#3A4247; --amber:#E6FF80;
}}
:host([data-theme="dark"]){
  --bg:#1E2327; --surface:#262C30; --surface-2:#2F363B; --surface-3:#3A4247;
  --ink:#F6F6F6; --ink-2:#D8DBD9; --ink-3:#9CA09C; --line:#3A4247; --line-2:#4A5358;
  --accent:#E6FF80; --accent-ink:#262C30; --accent-soft:#2E3A2B; --accent-hover:#F2FFB0; --logo:#E6FF80;
  --c1:#7FB3C0; --c2:#E6FF80; --c3:#D0E6EA; --c4:#DED0BE; --c5:#9CA09C; --c6:#F6F6F6;
  --o1:#2C4A57; --o2:#6F9FB0; --o3:#D0E6EA; --h1:#2C4A57; --h2:#3F6B7A; --h3:#6F9FB0; --h4:#D0E6EA;
  --new:#9CA09C; --offer:#7FB3C0; --teal:#7FB3C0; --teal-soft:#2C4A57; --violet:#C9CFCB; --violet-soft:#3A4247; --amber:#E6FF80;
}
/* sidebar: Slate Teal with off-white text, Electric Yellow-Green for the active entry */
.side{background:#003C50;border-right:0;color:#F6F6F6}
.side .logo,.side .logo .crm,.side .logo .sol{color:#F6F6F6}
.side .logo .mark{color:#E6FF80}
.side .logo .brand{border-left-color:rgba(246,246,246,.35)}
.side .nav a{color:rgba(246,246,246,.82)}
.side .nav a svg{color:rgba(246,246,246,.6)}
.side .nav a:hover{background:rgba(246,246,246,.10);color:#F6F6F6}
.side .nav a.on{background:#E6FF80;color:#003C50}
.side .nav a.on svg{color:#003C50}
.side .btn{background:rgba(246,246,246,.08);border-color:rgba(246,246,246,.25);color:#F6F6F6}
.side .btn:hover{background:rgba(246,246,246,.16)}
.side .b-pri{background:#E6FF80;border-color:#E6FF80;color:#003C50}
.side .b-pri:hover{background:#F2FFB0;border-color:#F2FFB0}
.side .dim,.side .muted,.side .sm,.side .side-meta{color:rgba(246,246,246,.65)}
.side .side-meta .demo{color:#E6FF80}
.side .wip{background:rgba(230,255,128,.18);color:#E6FF80}
/* primary actions: slate teal, yellow-green on hover; info chips in sky blue; no shortcut hint line */
.b-pri:hover{background:#E6FF80;border-color:#E6FF80;color:#003C50}
.chip.info{background:#D0E6EA;color:#003C50}
:focus-visible{outline-color:#003C50}
.kbd{display:none!important}
/* inside a SharePoint page the sidebar scrolls with the page instead of pinning to the viewport */
.side{position:static;height:auto;min-height:100%}
.shell{min-height:calc(100vh - 120px)}

/* ===== Phones and narrow tablets (30.09.2026) =====
   The rules above already stack the shell below 900 px. This block makes the result usable by thumb:
   one compact top bar, stacked page heads, tables as cards, full-width forms, larger touch targets.
   Desktop is not affected: every rule sits in a max-width or pointer query. */
@media (max-width:900px){
  /* the menu is a strip that scrolls sideways; a fade on the right edge shows there is more */
  .side{gap:8px 10px;padding:10px 12px 8px}
  .nav{position:relative;padding-right:20px;-webkit-overflow-scrolling:touch;
       -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .nav a{padding:8px 11px}
  .shell{min-height:0}
  /* filter label above its chips: German labels are longer than the 72 px column */
  .frow{row-gap:6px}
  .frow .flabel{width:100%}
  .inp.fsel{min-width:0;flex:1 1 180px}
}
@media (max-width:640px){
  .nscrm{font-size:15px}
  /* top bar: one row - search, then icon buttons; it scrolls away with the page */
  .top{position:static;flex-wrap:nowrap;gap:6px;padding:8px 12px;min-height:0}
  .top .search{order:0;flex:1 1 auto;min-width:0;max-width:none}
  .topacts{margin-left:0;gap:2px;flex:none}
  .top .lbl,.top .lbl2{display:none}
  .topacts .btn{padding:0 9px;min-width:36px}
  .results{width:calc(100vw - 24px);max-width:360px}
  .pop{right:auto;left:50%;transform:translateX(-70%);min-width:220px}
  .page{padding:16px 12px 48px;gap:16px}
  h1{font-size:21px}
  /* page head: title and subtitle on their own lines, actions below at full width */
  .phead{flex-direction:column;align-items:stretch;gap:10px}
  .phead .pacts{justify-content:flex-start}
  .phead .pacts .inp{flex:1 1 100%;width:100%!important}
  .phead h1{overflow-wrap:anywhere}
  .bar{gap:10px 18px}
  .subnav{width:100%} .subnav button{flex:1;padding:7px 8px}
  /* cards */
  .pad{padding:16px} .head{padding:14px 16px 0}
  .lead{padding:14px 16px}
  .lead>.rowb{align-items:stretch}
  .lead h3{white-space:normal;overflow-wrap:anywhere}
  .next{flex-wrap:wrap;row-gap:8px}
  .stages{display:grid;grid-template-columns:1fr 1fr}
  .stages .stg{width:100%}
  .lead-figs{grid-template-columns:1fr 1fr}
  /* quick-add: the task text gets the full width, date and button share the next line */
  .addrow{flex-wrap:wrap}
  .addrow .grow{flex:1 1 100%}
  .addrow input[type=date]{flex:1 1 auto}
  .comp .cf{gap:8px}
  /* tables become one card per row: first column is the headline, the rest are label/value lines */
  .tw{overflow-x:visible}
  .tw table,.tw tbody,.tw tr,.tw td{display:block}
  .tw thead{display:none}
  .tw tr{padding:12px 16px;border-bottom:1px solid var(--line)}
  .tw tbody tr:last-child{border-bottom:0}
  .tw td{padding:0;border:0;text-align:left}

/* ===== rev42-48 additions (10.10.2026): formatted text, format bar, Today button, offering notes and risks,
   links beside files, contact rating, column filters, one field height, two more stages. ===== */
/* Formatted text: paragraphs and lists, nothing else. */
.rt{display:flex;flex-direction:column;gap:7px;max-width:72ch}
.rt-p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.rt-l{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.rt-l li{overflow-wrap:anywhere}
/* The formatting buttons above a text box. */
.fmtbar{display:flex;align-items:center;gap:4px;margin-bottom:5px}
.fmtb{min-width:28px;height:26px;padding:0 7px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);
      color:var(--ink-2);font-size:13px;line-height:1;cursor:pointer}
.fmtb:hover{background:var(--surface-2);color:var(--ink)}
.fmt-bold{font-weight:700} .fmt-italic{font-style:italic;font-family:Georgia,serif}
.fmtbar .xs{margin-left:4px}
/* A date field keeps its "Today" button beside it. */
.dinp{gap:6px;align-items:center} .dinp .inp{flex:1;min-width:0}
.offer-notes{display:flex;flex-direction:column;gap:5px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
/* What could go wrong: same block as the notes, only the label is red. */
.risk-l{color:var(--crit)}
/* Links beside the files: SharePoint folders, websites, anything outside this file. */
.lnk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lnk:last-child{border-bottom:0}
.lnk .fic{background:var(--accent-soft);color:var(--accent)}
.lnk-t{font-weight:600;color:var(--ink);text-decoration:none}
.lnk-t:hover{color:var(--accent);text-decoration:underline}
/* The rating, written short: a grey star followed by the figure. */
.rating{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rating .st{color:var(--ink-3);font-size:13px;line-height:1}
.rating b{font-weight:650}
.rating .rw{color:var(--ink-3);font-size:13px;font-weight:400}
.ratb{border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;border-radius:5px}
.ratb:hover .rating b,.ratb:hover .dim{text-decoration:underline}
.rat-note{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.starpick{display:flex;gap:4px}
.starb{width:34px;height:34px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);
       color:var(--line-2);font-size:17px;line-height:1;cursor:pointer}
.starb.on{color:var(--amber);border-color:var(--amber)}
.b-ico{min-height:32px;width:32px;padding:0;border-radius:var(--r-sm)}
/* A column filter lives in its header, like a spreadsheet. */
th.tfh{padding:8px 10px 6px}
.tfwrap{position:relative;display:inline-block}
.tfb{display:inline-flex;align-items:center;gap:5px;max-width:200px;padding:5px 7px;border:1px solid transparent;border-radius:6px;
     background:transparent;color:var(--ink-3);font:inherit;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;cursor:pointer}
.tfb:hover{background:var(--surface-2);color:var(--ink)}
.tfb svg{color:var(--ink-3);flex:none}
.tfb.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.tfb.on svg{color:var(--accent)}
.tnum .tfwrap{float:right}
.tfmenu{position:fixed;z-index:60;min-width:200px;max-width:320px;max-height:min(320px,60vh);overflow:auto;
        display:flex;flex-direction:column;gap:1px;padding:5px;background:var(--surface);border:1px solid var(--line-2);
        border-radius:var(--r-sm);box-shadow:var(--shadow-hover);text-transform:none;letter-spacing:0}
/* popover: the browser's hidden-popover default must win over the display:flex above */
.tfmenu[popover]{margin:0;inset:auto;border:1px solid var(--line-2);padding:5px;background:var(--surface);color:var(--ink)}
.tfmenu[popover]:not(:popover-open){display:none}
.tfopts{display:flex;flex-direction:column;gap:1px}
.inp.tfsearch{height:32px;min-height:32px;margin-bottom:4px;font-size:13.5px}
.tfnone{padding:8px 9px;font-size:13px;color:var(--ink-3)}
.tfopt{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 9px;border:0;border-radius:6px;
       background:transparent;color:var(--ink);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.tfopt:hover{background:var(--surface-2)}
.tfopt.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tfopt.empty{color:var(--ink-3)}
.tbar{min-height:26px}
.inp{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:15px;font-family:inherit}
/* One height for every single-line field, whatever the browser would give it. */
input.inp,select.inp{height:42px}
input.inp[type="date"]{padding-top:0;padding-bottom:0}
.stg.on.s-progress{background:var(--progress)} .stg.on.s-cancelled{background:var(--cancelled)}
:host{ --progress:#7A6A1F; --cancelled:#9CA09C }
@media (prefers-color-scheme: dark){ :host(:not([data-theme="light"])){ --progress:#E0A93A; --cancelled:#7B8694 } }
:host([data-theme="dark"]){ --progress:#E0A93A; --cancelled:#7B8694 }
@media print{ .tfmenu,.fmtbar{display:none!important} .tfb{padding:0;background:none;color:inherit} .tfb svg{display:none} }

/* The bold Nordstern inside the claim takes the mark's colour on the teal sidebar (it was teal on teal). */
.side .logo .sol b{color:#E6FF80}
/* Phones: the column filters stay reachable as a row of buttons above the stacked rows. */
@media (max-width:640px){
  .tw thead,.tw thead tr{display:block}
  .tw thead tr{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line)}
  .tw th{display:none;padding:0;border:0}
  .tw th.tfh{display:block}
  .tw th.tfh .tfwrap{position:static}
  .tfmenu{max-width:none}
  .tnum .tfwrap{float:none}
}

/* ===== supervisor feedback 14.10.2026: letter row, starts-with box, sortable headers, further contacts ===== */
.nf{gap:4px;align-items:center}
.azb{min-width:28px;height:28px;padding:0 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.azb:hover{background:var(--surface-2);color:var(--ink)}
.azb.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.azb.none{opacity:.35;cursor:default}
.inp.nf-box{width:150px;min-height:30px;height:30px;padding:0 10px;font-size:13.5px;margin-left:6px}
/* header: the label sorts, the small chevron beside it filters */
.tsb{display:inline-flex;align-items:center;gap:4px;padding:5px 4px 5px 7px;border:0;border-radius:6px;background:transparent;color:var(--ink-3);font:inherit;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;cursor:pointer;white-space:nowrap}
.tsb:hover{background:var(--surface-2);color:var(--ink)}
.tsb.on{color:var(--accent)}
.tsa{font-size:9px;min-width:9px;display:inline-block}
.tfb{padding:5px 5px;min-width:0}
.tnum .tfwrap{float:right}
@media (max-width:640px){
  .nf{gap:3px} .azb{min-width:26px;height:30px} .inp.nf-box{flex:1 1 100%;margin:4px 0 0}
  .tw th.tfh .tfwrap{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:6px;padding:0 2px;margin:2px 0}
  .tsb{text-transform:none;letter-spacing:0;font-size:12.5px}
}
